<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX Analytics · Guiones Agosto 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0F15;--surface:#161923;--surface2:#1E2230;--border:#272B3A;
  --text:#EEEEF0;--text2:#7A7D90;--text3:#4A4D60;
  --jessica:#10B981;--junior:#F59E0B;
  --reel:#8B5CF6;--clip:#EC4899;--carrusel:#3B82F6;
  --viral:#EF4444;--valor:#F59E0B;--venta:#10B981;
  --fria:#60A5FA;--media:#A78BFA;--avanzada:#F97316;--compra:#34D399;
  --n1:#6B7280;--n2:#3B82F6;--n3:#8B5CF6;--n4:#F59E0B;--n5:#EF4444;
  --accent:#6366F1;--accent2:#4F46E5;
  --radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;letter-spacing:-.5px}
.header-title{flex:1}
.header-title h1{font-size:16px;font-weight:700;color:var(--text)}
.header-title p{font-size:12px;color:var(--text2)}
.btn{border:none;cursor:pointer;border-radius:var(--radius-sm);font-size:13px;font-weight:600;padding:8px 16px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#EF444420;color:#EF4444;border:1px solid #EF444430}
.btn-danger:hover{background:#EF444430}

/* NAV TABS */
.nav-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav-tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--text2);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TOOLBAR */
.toolbar{padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px 8px 36px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stats-bar{display:flex;gap:16px;padding:0 24px 12px}
.stat{font-size:12px;color:var(--text2)}.stat span{color:var(--text);font-weight:700}

/* SEMANA HEADERS */
.semana-block{padding:0 24px 32px}
.semana-header{display:flex;align-items:center;gap:12px;padding:20px 0 14px;border-top:1px solid var(--border);margin-bottom:0}
.semana-header:first-child{border-top:none}
.semana-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.semana-title{font-size:18px;font-weight:800;color:var(--text)}
.semana-count{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--text2)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding-bottom:12px}

/* SECTION LABEL WITHIN SEMANA */
.section-label{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.section-label-text{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.section-line{flex:1;height:1px;background:var(--border)}
.jessica-section .section-label-text{color:var(--jessica)}
.junior-section .section-label-text{color:var(--junior)}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.15)}
.card.jessica-card{border-left:3px solid var(--jessica)}
.card.junior-card{border-left:3px solid var(--junior)}
.card.urgent{border-top:2px solid #EF4444}
.card-body{padding:14px}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.badge-reel{background:#8B5CF620;color:#8B5CF6;border:1px solid #8B5CF630}
.badge-clip{background:#EC489920;color:#EC4899;border:1px solid #EC489930}
.badge-carrusel{background:#3B82F620;color:#3B82F6;border:1px solid #3B82F630}
.badge-jessica{background:#10B98120;color:#10B981;border:1px solid #10B98130}
.badge-junior{background:#F59E0B20;color:#F59E0B;border:1px solid #F59E0B30}
.badge-viral{background:#EF444420;color:#EF4444}
.badge-valor{background:#F59E0B20;color:#F59E0B}
.badge-venta{background:#10B98120;color:#10B981}
.badge-urgente{background:#EF444420;color:#EF4444;border:1px solid #EF444430}
.badge-n1{background:#6B728020;color:#9CA3AF}
.badge-n2{background:#3B82F620;color:#93C5FD}
.badge-n3{background:#8B5CF620;color:#C4B5FD}
.badge-n4{background:#F59E0B20;color:#FCD34D}
.card-date{font-size:11px;color:var(--text3);margin-bottom:4px}
.card-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:8px}
.card-hook{font-size:12px;color:var(--text2);line-height:1.4;font-style:italic;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2)}
.card-tablero{font-size:11px;color:var(--text2)}
.card-actions{display:flex;gap:6px}
.icon-btn{width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;background:transparent;color:var(--text2)}
.icon-btn:hover{background:var(--border);color:var(--text)}
.icon-btn.teleprompter-btn{color:var(--jessica)}
.icon-btn.teleprompter-btn:hover{background:#10B98120}

/* MODAL OVERLAY */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(4px);padding:20px;overflow-y:auto}
.modal-overlay.active{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;margin:auto;overflow:hidden}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal-header-info{flex:1}
.modal-header h2{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-header-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-close{width:32px;height:32px;border:none;background:var(--surface2);border-radius:8px;cursor:pointer;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{color:var(--text);background:var(--border)}
.modal-body{padding:20px 24px}
.field{margin-bottom:16px}
.field-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.field-value{font-size:14px;color:var(--text);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.field-value.guion{font-family:'SF Mono','Fira Code',monospace;font-size:13px;white-space:pre-wrap;max-height:320px;overflow-y:auto;line-height:1.7}
.field textarea{width:100%;background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:13px;font-family:'SF Mono','Fira Code',monospace;line-height:1.7;resize:vertical;outline:none;white-space:pre-wrap}
.field textarea:focus{border-color:var(--accent)}
.field-link{color:#60A5FA;font-size:13px;text-decoration:none}
.field-link:hover{text-decoration:underline}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-footer .spacer{flex:1}
.music-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;color:var(--text);font-size:13px;outline:none;width:100%;margin-top:4px}
.music-input:focus{border-color:var(--accent)}
.saved-msg{font-size:12px;color:var(--jessica);display:none}
.saved-msg.show{display:block}

/* TELEPROMPTER */
.tp-overlay{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column}
.tp-overlay.active{display:flex}
.tp-controls{background:rgba(0,0,0,.9);border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px;z-index:2;flex-shrink:0}
.tp-btn{background:#1a1a1a;border:1px solid #333;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.tp-btn:hover{background:#2a2a2a}
.tp-btn.play-btn{background:var(--jessica);border-color:var(--jessica);min-width:90px}
.tp-btn.play-btn:hover{background:#0DA271}
.tp-back{background:transparent;border:1px solid #333;color:#888;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s}
.tp-back:hover{color:#fff;border-color:#555}
.tp-title{flex:1;font-size:13px;color:#888;text-align:center}
.speed-wrap{display:flex;align-items:center;gap:8px}
.speed-wrap label{font-size:11px;color:#666;white-space:nowrap}
.speed-wrap input[type=range]{width:100px;accent-color:var(--jessica)}
.speed-val{font-size:12px;color:var(--jessica);min-width:16px;text-align:center}
.tp-device-toggle{display:flex;gap:4px}
.tp-device-btn{background:#1a1a1a;border:1px solid #333;color:#666;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s}
.tp-device-btn.active{background:#2a2a2a;color:#fff;border-color:#555}
.tp-body{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
/* Fullscreen mode */
.tp-body.mode-full .tp-content-wrap{width:100%;max-width:800px;height:100%;overflow:hidden;position:relative}
/* iPad mode */
.tp-body.mode-ipad .tp-device-frame{width:320px;height:480px;border:8px solid #333;border-radius:28px;background:#000;overflow:hidden;box-shadow:0 0 0 2px #444,0 30px 80px rgba(0,0,0,.8);position:relative}
.tp-body.mode-ipad .tp-device-frame::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:60px;height:4px;background:#222;border-radius:4px;z-index:1}
.tp-body.mode-ipad .tp-content-wrap{position:absolute;inset:24px 0 0;overflow:hidden}
/* Laptop mode */
.tp-body.mode-laptop .tp-device-outer{position:relative}
.tp-body.mode-laptop .tp-device-screen{width:580px;height:380px;border:6px solid #2a2a2a;border-radius:12px 12px 0 0;background:#000;overflow:hidden;box-shadow:0 0 0 1px #444}
.tp-body.mode-laptop .tp-device-base{width:640px;height:20px;background:#2a2a2a;border-radius:0 0 8px 8px;margin-top:-1px}
.tp-body.mode-laptop .tp-device-base::after{content:'';display:block;width:120px;height:8px;background:#1a1a1a;border-radius:0 0 6px 6px;margin:0 auto}
.tp-body.mode-laptop .tp-content-wrap{position:absolute;inset:6px 6px 0;overflow:hidden}
/* CONTENT inside teleprompter */
.tp-scroller{height:100%;overflow:hidden;position:relative}
.tp-text{padding:40px 32px 200px;font-size:32px;font-weight:600;line-height:1.9;color:#fff;white-space:pre-wrap;will-change:transform}
.tp-body.mode-ipad .tp-text{font-size:18px;padding:20px 16px 120px;line-height:1.8}
.tp-body.mode-laptop .tp-text{font-size:24px;padding:30px 28px 200px;line-height:1.8}
.tp-text .nota{color:#555;font-size:.7em;font-style:italic}
.tp-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--jessica);transition:width .1s;z-index:3}
/* Line highlight overlay */
.tp-scroller::before{content:'';position:absolute;top:0;left:0;right:0;height:80px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);z-index:1;pointer-events:none}
.tp-scroller::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);z-index:1;pointer-events:none}

/* ADD MODAL */
.add-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;margin:auto;padding:24px;overflow:hidden}
.add-modal h3{font-size:16px;font-weight:800;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2)}
.form-field input,.form-field select,.form-field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;outline:none}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent)}
.form-field select option{background:var(--surface)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3A3D50}

/* UTILS */
.hidden{display:none!important}

/* CALENDAR VIEW */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 12px;flex-wrap:wrap;gap:8px}
.cal-nav-title{font-size:15px;font-weight:700;color:var(--text)}
.cal-nav-btns{display:flex;gap:8px}
.cal-scroll{overflow-x:auto;padding:0 24px 40px}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:910px}
.cal-day-header{padding:8px 10px 6px;background:var(--surface);border-radius:var(--radius-sm) var(--radius-sm) 0 0;border:1px solid var(--border);border-bottom:none;text-align:center}
.cal-day-name{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.cal-day-num{font-size:22px;font-weight:800;color:var(--text);line-height:1.2}
.cal-day-num.today{color:var(--accent)}
.cal-day-body{background:var(--surface2);border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:6px;min-height:80px;display:flex;flex-direction:column;gap:5px}
.cal-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 9px;cursor:pointer;transition:all .15s;border-left:3px solid var(--border)}
.cal-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.12)}
.cal-card.jessica-cal{border-left-color:var(--jessica)}
.cal-card.junior-cal{border-left-color:var(--junior)}
.cal-card-tipo{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text2);margin-bottom:2px}
.cal-card-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cal-empty{font-size:11px;color:var(--text3);text-align:center;padding:14px 4px}
/* day header with + button */
.cal-day-header{position:relative}
.cal-add-btn{position:absolute;top:6px;right:6px;width:20px;height:20px;border:none;border-radius:6px;background:var(--surface2);color:var(--text2);font-size:15px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s}
.cal-day:hover .cal-add-btn{opacity:1}
.cal-add-btn:hover{background:var(--accent);color:#fff}
/* weekend = Libre */
.cal-day-header.weekend{background:var(--surface);opacity:.55}
.cal-day-header.weekend .cal-day-name,.cal-day-header.weekend .cal-day-num{color:var(--text3)}
.cal-day-body.weekend{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,var(--surface2) 6px,var(--surface2) 7px);min-height:80px}
.cal-libre{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);text-align:center;padding:20px 4px;display:flex;flex-direction:column;gap:3px}
.cal-libre span{font-size:9px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text3);opacity:.7}
/* drag & drop */
.cal-card{cursor:grab}
.cal-card:active{cursor:grabbing}
.cal-card.dragging{opacity:.4;transform:scale(.97)}
.cal-day-body.drop-over{background:var(--accent);background:#6366F118;border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">FOX</div>
  <div class="header-title">
    <h1>Guiones · Agosto 2026</h1>
    <p>19 piezas · 5 semanas (Lun–Vie) · Agosto 2026</p>
  </div>
  <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇ Exportar</button>
  <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Añadir pieza</button>
</header>

<!-- NAVIGATION -->
<nav class="nav-wrap" id="navTabs">
  <button class="nav-tab active" data-tab="cal">📅 Calendario</button>
  <button class="nav-tab" data-tab="all">Todas (19)</button>
  <button class="nav-tab" data-tab="jessica">🎬 Jessica (19)</button>
  <button class="nav-tab" data-tab="junior">🎨 Junior (0)</button>
  <button class="nav-tab" data-tab="s1">Semana 1</button>
  <button class="nav-tab" data-tab="s2">Semana 2</button>
  <button class="nav-tab" data-tab="s3">Semana 3</button>
  <button class="nav-tab" data-tab="s4">Semana 4</button>
  <button class="nav-tab" data-tab="s5">Semana 5</button>
</nav>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar por título, gancho, idea..." oninput="renderAll()">
  </div>
  <div class="filters" id="filterChips">
    <button class="chip" data-filter="tipo" data-val="Reel">Reels</button>
    <button class="chip" data-filter="tipo" data-val="Clip">Clips</button>
    <button class="chip" data-filter="tipo" data-val="Carrusel">Carruseles</button>
    <button class="chip" data-filter="proposito" data-val="Viral">🔥 Viral</button>
    <button class="chip" data-filter="proposito" data-val="Valor">💡 Valor</button>
    <button class="chip" data-filter="proposito" data-val="Venta">💰 Venta</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat">Jessica <span id="stat-jessica">8</span></div>
  <div class="stat">Junior <span id="stat-junior">13</span></div>
  <div class="stat">Reels <span id="stat-reel">8</span></div>
  <div class="stat">Clips <span id="stat-clip">6</span></div>
  <div class="stat">Carruseles <span id="stat-carrusel">7</span></div>
</div>

<!-- MAIN CONTENT -->
<main id="mainContent" style="padding:0 24px 40px"></main>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" onclick="closeDetailIfOutside(event)">
  <div class="modal" id="detailModalInner">
    <div class="modal-header">
      <div class="modal-header-info">
        <h2 id="dTitle"></h2>
        <div class="modal-header-tags" id="dTags"></div>
      </div>

{"id": "S1-A01", "dia": "MIÉ 5 Ago", "fechaISO": "2026-08-05", "semana": 1, "idea": "AI Act: usar ChatGPT ya obliga a tu empresa", "tipo": "Reel", "formato": "Talking head, 1 toma · Estructura 15 · Vacío de Información", "proposito": "Viral", "tablero": "Audiencia Fría", "bateria": "N2", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"CHATGPT YA TE OBLIGA POR LEY\"", "ganchoVisual": "Plano medio. Jessica sostiene el móvil HACIA CÁMARA con ChatGPT abierto y legible. Fondo liso, sin nada detrás. Solo 3 elementos: ella, el móvil y el texto.", "guion": "Hay una ley que entró hace cuatro días y ya te obliga. Aunque no la hayas leído.\n\nY no es por tener inteligencia artificial. Es por usarla. Y usar ChatGPT cuenta.\n\nDesde el dos de agosto, si alguien de tu equipo la usa, tu empresa es responsable del despliegue. No pregunta cuánto facturas.\n\nTres cosas que necesitas. Una: saber quién la usa y para qué. Dos: formación por puesto. Tres: un registro escrito de esa formación.\n\nGuarda esto antes de que alguien te lo pregunte.", "cta": "Guarda esto antes de que alguien te lo pregunte. Y si en tu empresa nadie lo sabía, comenta \"nadie\".", "notaJunior": "ESTRUCTURA 15 · VACÍO DE INFORMACIÓN. Componentes: 1) gancho con vacío 2) pico de interés 3) entrega de valor 4) paso a paso 5) CTA.\n\nEL MÓVIL HACIA CÁMARA EN EL SEGUNDO 0 ES EL ESTÍMULO NÚCLEO. Si no se lee la pantalla, el gancho pierde la mitad de su fuerza.\n\nTEXTO EN PANTALLA durante el desarrollo: \"2 DE AGOSTO\" / \"1. QUIÉN LA USA\" / \"2. FORMACIÓN\" / \"3. REGISTRO\".\n\nFUENTE: Reglamento UE 2024/1689 (AI Act), aplicable desde el 2 de agosto de 2026. Sanciones de hasta 35M€ SOLO para infracciones graves de grandes empresas — NO mencionarlo, en una pyme suena a clickbait.\n\nTONO: nunca acusar. 'Mucha gente cree' en vez de 'tú fallas'.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": true},
{"id": "S1-A02", "dia": "JUE 6 Ago", "fechaISO": "2026-08-06", "semana": 1, "idea": "Contratar más vs ordenar lo que hay", "tipo": "Reel", "formato": "Versus · bloques A/B alternos · Estructura 32", "proposito": "Viral", "tablero": "Audiencia Media", "bateria": "N2", "duracion": "~28 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"+3 NÓMINAS VS +0 NÓMINAS\"", "ganchoVisual": "Jessica en UN SOLO PLANO seguido, a cámara. NO hay pantalla partida real: el versus está en el TEXTO. En edición, el texto alterna izquierda (rojo) / derecha (verde) y se va acumulando hasta que al final se ven los 4 pares a la vez.", "guion": "El que contrata contra el que ordena. Mismo problema: los pedidos se amontonan.\n\n¿Qué hace? Uno publica una oferta de empleo. El otro mira dónde se atasca el pedido.\n\n¿Qué le cuesta? Uno, tres sueldos todos los meses. El otro, una tarde.\n\n¿Cuándo se resuelve? Uno, a los dos meses. El otro, a la semana siguiente.\n\n¿Y al año? Uno hace el mismo trabajo con tres sueldos más. El otro hace el mismo trabajo con la misma gente.\n\nLos dos quitaron el agobio. Uno lo paga todos los meses.", "cta": "¿Cuál eres ahora mismo? Comenta 1 o 2.", "notaJunior": "ESTRUCTURA 32 · VERSUS DE NIVEL ESTRATÉGICO. Componentes: 1) gancho implícito (confrontación, NO pregunta) 2) bloques paralelos misma situación 3) patrón repetitivo 4) escalamiento conceptual 5) cierre con transferencia de autoridad.\n\n⚠️ VER LA REFERENCIA ANTES DE GRABAR: los reels de @raulgamboaec (2,3M y 1,8M views).\n\nCADA PAR RESPONDE A LA MISMA PREGUNTA. Ese es el mecanismo: si cada línea compara un eje distinto, no se entiende.\n\nORDEN DE LOS PARES (NO CAMBIAR): qué hace → qué cuesta → cuándo se resuelve → y al año. Sube de acción a dinero a tiempo a estructura. El último es el que duele.\n\nPATRÓN VISUAL OBLIGATORIO: cada bloque entra con la MISMA animación, en la MISMA posición y durando lo MISMO. La repetición es lo que sostiene la retención. Si la rompes, se cae.\n\nJessica lee del tirón, NO hace de dos personajes.", "referencia": "https://www.instagram.com/p/DZ_O7NAu1ZJ/", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": true},
{"id": "S1-A03", "dia": "VIE 7 Ago", "fechaISO": "2026-08-07", "semana": 1, "idea": "Testimonio VAO: 'a tu medida' era mentira", "tipo": "Reel", "formato": "Clip tratado · testimonio en marco + cita grande · Estructura 3", "proposito": "Viral", "tablero": "Audiencia Avanzada", "bateria": "N3", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"'A TU MEDIDA' ERA MENTIRA\"", "ganchoVisual": "Fondo de color plano. El vídeo de Alexandra en un marco PEQUEÑO y centrado abajo. La cita ocupa el tercio superior. Nada más en pantalla.", "guion": "[ALEXANDRA, sin nada delante]\n\"Sí te venden un programa y siempre te dicen: es a tu medida. Pero realmente no.\"\n\"Empezamos con otra empresa que no nos dio la talla. Nos hicieron un programa, pero acorde a ellos.\"\n\n[JESSICA EN OFF, sin aparecer]\nEsto lo dice una clienta. Y es la frase que más escuchamos.\n\nEl error no es comprar. Es comprar antes de que alguien mire cómo trabajas por dentro.\n\nPregunta esto antes de firmar: \"¿Esto ya existe o lo vais a construir para mí?\" Si te contestan que lo configuran, no es a medida. Es el mismo programa con tu logo.", "cta": "¿Te ha pasado? Cuéntamelo abajo. Sé que no eres la única.", "notaJunior": "ESTRUCTURA 3 · REACCIÓN. Componentes: 1) reacción + opinión inicial 2) señalar el problema 3) solución práctica 4) invitación.\n\n⚠️ REGLA DE LA SERIE 'ASÍ ESTÁBAMOS ANTES': el cliente habla PRIMERO y habla SOLO. Ninguna voz de marca antes del segundo 9. Ahí está toda la credibilidad de la pieza. NADA de intro de logo.\n\nRÓTULO FIJO: \"ASÍ ESTÁBAMOS ANTES · 01\" en la esquina inferior. Mismo tipo y sitio en las 4 piezas de la serie (7, 13, 20 y 27 de agosto).\n\nLA SOLUCIÓN PRÁCTICA (la pregunta antes de firmar) es lo que hace que el espectador se lleve algo. No quitarla.\n\nFUENTE: testimonio grabado de Alexandra Elvira, Container VAO. Material ya existente.", "referencia": "Testimonio grabado · Alexandra Elvira (Container VAO)", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": true},
{"id": "S2-A04", "dia": "LUN 10 Ago", "fechaISO": "2026-08-10", "semana": 2, "idea": "El 70% de los ciberataques van a pymes", "tipo": "Clip", "formato": "Clip de texto + datos, sin Jessica · Estructura 19", "proposito": "Viral", "tablero": "Audiencia Fría", "bateria": "N1", "duracion": "~28 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"NO ATACAN A LOS GRANDES\"", "ganchoVisual": "Sin Jessica. Texto sobre fondo oscuro, los datos entran uno a uno con corte seco. Sin música con letra.", "guion": "Mucha gente cree que los ciberataques van contra las grandes. Que a una empresa de veinte personas nadie la mira.\n\nEl setenta por ciento de los ataques en España va contra pymes. Y no es mala suerte.\n\nVan a por ti precisamente porque eres pequeño. Tienes datos de clientes, facturación y proveedores. Y casi ninguna defensa.\n\nEl año pasado INCIBE gestionó ciento veintidós mil incidentes. Un veintiséis por ciento más que el anterior.\n\nSi creías que esto no iba contigo, guárdalo.", "cta": "Si creías que esto no iba contigo, guárdalo. Y mándaselo al que lleva la informática.", "notaJunior": "ESTRUCTURA 19 · DESAFÍO CONTRACORRIENTE: romper una creencia popular con lógica. Componentes: 1) creencia popular 2) ruptura con dato 3) el porqué 4) consecuencia 5) CTA.\n\nNO NECESITA GRABACIÓN. Es texto en pantalla — se produce en una tarde.\n\nTEXTO CLAVE: \"70% VAN A PYMES\" / \"122.223 INCIDENTES\" / \"+26%\".\n\nFUENTE: INCIBE, balance 2025.\n\nEl CTA de reenvío ('mándaselo al que lleva la informática') busca compartidos, que es la señal que más pesa en el algoritmo desde febrero de 2026.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S2-A05", "dia": "MAR 11 Ago", "fechaISO": "2026-08-11", "semana": 2, "idea": "Vendieron más y ganaron menos", "tipo": "Reel", "formato": "Talking head · Estructura 10 · Gancho Controversial", "proposito": "Viral", "tablero": "Audiencia Media", "bateria": "N2", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"VENDIERON MÁS Y GANARON MENOS\"", "ganchoVisual": "Plano medio, fondo liso. Sin props. La fuerza está en el dato, no en el atrezzo.", "guion": "Vender más el año pasado no salvó a casi nadie. Y hay un dato que lo demuestra.\n\nEl cuarenta y dos por ciento de las pymes españolas cerró 2025 sin rentabilidad. Y cuatro de cada diez de esas habían aumentado sus ventas.\n\nLo dijo el presidente de los gestores administrativos: las empresas están haciendo más para conseguir menos.\n\nY tiene todo el sentido. Cuando creces sin ordenar, cada venta nueva te cuesta más que la anterior. Más gente, más pasos, más errores.", "cta": "¿Facturaste más el año pasado? ¿Y ganaste más? Contesta abajo, aunque sea con un sí o un no.", "notaJunior": "ESTRUCTURA 10 · GANCHO CONTROVERSIAL: afirmación contraintuitiva que abre debate.\n\nTEXTO EN PANTALLA: \"42% SIN RENTABILIDAD\" / \"4 DE CADA 10 VENDIERON MÁS\".\n\nFUENTE: Consejo General de Gestores Administrativos, cierre 2025. La cita es literal — no adornarla.\n\nEL CIERRE ('y tiene todo el sentido: cuando creces sin ordenar...') es lo que hace que se recuerde. El dato solo se olvida; el mecanismo se repite.\n\nCTA de sí/no = mínima fricción.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S2-A06", "dia": "MIÉ 12 Ago", "fechaISO": "2026-08-12", "semana": 2, "idea": "Pagaron el rescate y no recuperaron los datos", "tipo": "Reel", "formato": "Talking head · Estructura 18 · El Momento WTF", "proposito": "Viral", "tablero": "Audiencia Media", "bateria": "N2", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"PAGARON Y NO RECUPERARON\"", "ganchoVisual": "Plano medio, fondo liso. Ritmo pausado en el dato del giro (segundo 11-19), que es donde está el WTF.", "guion": "Una de cada tres pymes españolas sufrió un secuestro de datos este año.\n\nY muchas hicieron lo que parece lógico: pagar el rescate para recuperarlos.\n\nDe las que pagaron, solo el cincuenta y siete por ciento recuperó sus datos. Cuatro de cada diez se quedaron sin datos y sin el dinero.\n\nY el veinticinco por ciento acabó con su información publicada igual. Pagar ya ni siquiera evita eso.\n\nSi tienes una copia de seguridad que nadie ha probado nunca, hoy es buen día.", "cta": "Si tienes una copia de seguridad que nadie ha probado nunca, hoy es buen día. Guarda esto y pruébala.", "notaJunior": "ESTRUCTURA 18 · EL MOMENTO WTF: hecho impactante → tensión → plot twist.\n\nEL GIRO ESTÁ EN 'de las que pagaron, solo el 57% recuperó'. Ahí hay que bajar el ritmo. Es el momento que hace que el vídeo se comparta.\n\nTEXTO EN PANTALLA: \"31% ATACADAS\" / \"SOLO 57% RECUPERÓ\" / \"25% FILTRADAS IGUAL\".\n\nFUENTE: Informe de Ciberpreparación de Hiscox.\n\nCTA de acción concreta (probar la copia de seguridad) + guardado.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S2-A07", "dia": "JUE 13 Ago", "fechaISO": "2026-08-13", "semana": 2, "idea": "Testimonio Finanzas: pagó un software y siguió con Excel", "tipo": "Reel", "formato": "Clip tratado · testimonio en marco · Estructura 18", "proposito": "Viral", "tablero": "Audiencia Avanzada", "bateria": "N3", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"PAGÓ Y SIGUIÓ CON EXCEL\"", "ganchoVisual": "Mismo tratamiento que la pieza del 7: fondo plano, vídeo de Daniel en marco pequeño abajo, cita en el tercio superior.", "guion": "[DANIEL, sin nada delante]\n\"Yo había invertido un dinero en hacer el software con el programador anterior.\"\n\"Pues fíjate cómo era de rígido el sistema, que yo seguía llevando la contabilidad de mi empresa en mi Excel.\"\n\"Porque tardaba menos.\"\n\n[JESSICA EN OFF]\nPagó por un programa. Y siguió usando la hoja de cálculo porque era más rápida. Eso no es un problema de software. Es que nadie miró cómo trabajaba antes de construirlo.", "cta": "¿Tienes algún programa pagado que en realidad nadie usa? Somos más de los que parece. Cuéntalo abajo.", "notaJunior": "ESTRUCTURA 18 · EL MOMENTO WTF aplicado a testimonio. El plot twist es la frase corta: \"Porque tardaba menos.\" DEJARLA SOLA, con aire antes y después.\n\nRÓTULO: \"ASÍ ESTÁBAMOS ANTES · 02\".\n\nMISMA REGLA DE LA SERIE: el cliente habla primero. Jessica no entra hasta el segundo 18.\n\nFUENTE: testimonio grabado de Daniel Gómez, Finanzas del Emprendedor. Material ya existente.", "referencia": "Testimonio grabado · Daniel Gómez (Finanzas del Emprendedor)", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S2-A08", "dia": "VIE 14 Ago", "fechaISO": "2026-08-14", "semana": 2, "idea": "El 79% cree que está digitalizada, solo el 9% lo está", "tipo": "Reel", "formato": "Versus texto · Estructura 30 · La Máquina de Comentarios", "proposito": "Viral", "tablero": "Audiencia Media", "bateria": "N2", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"CREES QUE VAS BIEN. NO.\"", "ganchoVisual": "Contraste numérico grande: 79% a un lado, 9% al otro. Jessica a cámara con los números entrando encima.", "guion": "Mucha gente cree que su empresa ya está digitalizada. Tienen web, tienen correo, tienen un programa de facturas.\n\nY luego resulta que el margen real lo saben a fin de mes. Y que si falta una persona, se para un proceso entero.\n\nHay una forma fácil de saber en cuál de los dos grupos estás.\n\nEl setenta y nueve por ciento de las pymes españolas cree que está digitalizada. Solo el nueve por ciento lo está de verdad. Setenta puntos de diferencia entre lo que creen y lo que es.\n\nLa diferencia no la marca el dinero. La marca si tu información está en un sitio o en catorce.\n\nHice un test de seis preguntas para saber en cuál estás.", "cta": "Comenta \"TEST\" y te mando las 6 preguntas para saber en cuál de los dos grupos estás.", "notaJunior": "⚠️ PRIMERA CAPTURA DEL MES. EL ENTREGABLE TIENE QUE EXISTIR EL DÍA QUE SE PUBLICA: test de 6 preguntas.\n\nESTRUCTURA 30 · LA MÁQUINA DE COMENTARIOS. Componentes: 1) problema 2) agitación 3) oportunidad 4) insight 5) solución 6) prueba social 7) regalo con palabra clave.\n\nESTE ES EL MECANISMO QUE LA AUDITORÍA MARCÓ COMO FUGA Nº1. Tres cuentas independientes lo confirman: Marote (26.552 comentarios en un reel), Factorial (119 comentarios) y Raúl Gamboa (2,3M views). El CTA viejo ('te leo en comentarios') produjo CERO en 28 vídeos.\n\nTEXTO EN PANTALLA: \"79% CREE\" / \"9% ES\" / \"70 PUNTOS DE DIFERENCIA\".\n\nFUENTE: Barómetro de Digitalización de la pyme española 2026.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": true},
{"id": "S3-A09", "dia": "LUN 17 Ago", "fechaISO": "2026-08-17", "semana": 3, "idea": "Abrir el portátil en vacaciones", "tipo": "Reel", "formato": "Talking head · Estructura 13 · El Espejo", "proposito": "Viral", "tablero": "Audiencia Fría", "bateria": "N2", "duracion": "~30 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"ABRES EL PORTÁTIL EN VACACIONES\"", "ganchoVisual": "Plano medio. Si se puede grabar en exterior o con luz de verano, mejor: refuerza el contexto de vacaciones sin necesidad de B-roll.", "guion": "Estás en la playa. Son las once. Y abres el portátil \"solo para revisar una cosa\".\n\nY la cosa eran tres. Y acabas contestando un correo que podía esperar al lunes, con el móvil lleno de arena.\n\nMucha gente cree que eso es compromiso. Y a veces lo es. Pero la mayoría de las veces es que no hay nadie más que sepa hacerlo.\n\nY tiene todo el sentido: si nunca lo escribiste, solo vive en tu cabeza. Y tu cabeza también se va de vacaciones.", "cta": "¿Cuántas veces has abierto el portátil estas vacaciones? Comenta el número. Sin vergüenza.", "notaJunior": "ESTRUCTURA 13 · EL ESPEJO: verbalizar lo que la audiencia siente y no dice.\n\nLA CONCESIÓN ('Y a veces lo es') NO SE PUEDE QUITAR. Sin ella la pieza suena a sermón; con ella suena a alguien con criterio.\n\nDETALLE CONCRETO OBLIGATORIO: 'el móvil lleno de arena'. Lo concreto es lo que hace que se reconozcan. Sin ese detalle es una frase genérica más.\n\nCTA numérico = mínima fricción, y el 'sin vergüenza' quita el pudor de admitirlo.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S3-A10", "dia": "MAR 18 Ago", "fechaISO": "2026-08-18", "semana": 3, "idea": "Kit Digital sigue abierto con bono de IA de 6.000€", "tipo": "Reel", "formato": "Talking head · Estructura 30 · La Máquina de Comentarios", "proposito": "Valor", "tablero": "Audiencia Media", "bateria": "N2", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"6.000€ QUE NADIE PIDE\"", "ganchoVisual": "Plano medio, fondo liso. La cifra 6.000€ entra grande en el segundo 4.", "guion": "Mucha gente da por hecho que el Kit Digital ya se cerró. Y no.\n\nSigue abierto. Y desde abril hay una categoría nueva de inteligencia artificial con bono de hasta seis mil euros.\n\nNo se cierra en una fecha. Se cierra cuando se agotan los fondos.\n\nY eso cambia cómo hay que jugarlo. No es \"lo pido en septiembre cuando vuelva\". Es por orden de llegada.\n\nHay empresas de diez personas que ya lo tienen concedido. No hace falta ser grande, hace falta pedirlo.", "cta": "Comenta \"KIT\" y te mando la lista de requisitos para que veas en dos minutos si tu empresa entra.", "notaJunior": "⚠️ CAPTURA. ENTREGABLE NECESARIO: lista de requisitos del Kit Digital.\n\nESTRUCTURA 30 · LA MÁQUINA DE COMENTARIOS.\n\nEL ÁNGULO DIFERENCIAL ES 'no se cierra en una fecha, se cierra cuando se agotan los fondos'. Eso convierte una ayuda aburrida en urgencia real y honesta.\n\nFUENTE: Orden TDF/39/2026 (28-ene-2026) reactivó el Kit Digital con fondos remanentes; categoría de IA añadida en abril de 2026, bono hasta 6.000€.\n\nTEXTO EN PANTALLA: \"SIGUE ABIERTO\" / \"HASTA 6.000€\" / \"POR ORDEN DE LLEGADA\".", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": true},
{"id": "S3-A11", "dia": "MIÉ 19 Ago", "fechaISO": "2026-08-19", "semana": 3, "idea": "Esto sí es tu trabajo. Esto no.", "tipo": "Clip", "formato": "Clip de texto, sin Jessica · Versus · Estructura 32", "proposito": "Viral", "tablero": "Audiencia Avanzada", "bateria": "N1", "duracion": "~30 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"ESTO SÍ ES TU TRABAJO. ESTO NO.\"", "ganchoVisual": "Sin Jessica. Dos columnas que se van llenando. Verde = tuyo. Gris = no tuyo. Mismo tiempo por bloque.", "guion": "Lo que sí es tu trabajo. Y lo que llevas tres años haciendo sin que lo sea.\n\nTuyo: decidir a quién contratas. No tuyo: cuadrar el Excel de vacaciones.\n\nTuyo: aprobar un descuento para cerrar un cliente grande. No tuyo: calcular a mano cuánto margen dejó.\n\nTuyo: decidir a qué mercado entráis. No tuyo: copiar datos de una pantalla a otra.\n\nTuyo: que la empresa tenga un rumbo. No tuyo: ser el sitio por donde pasa toda la información.\n\nLo de la izquierda te lo pagan. Lo de la derecha te lo cobras tú en horas.", "cta": "¿Cuál de las de la derecha harás hoy? Comenta una.", "notaJunior": "ESTRUCTURA 32 · VERSUS. NO NECESITA GRABACIÓN — es texto animado.\n\n⚠️ VER REFERENCIA @raulgamboaec ANTES DE MONTARLO.\n\nPATRÓN REPETIDO OBLIGATORIO: los 4 pares entran igual, en la misma posición, durando lo mismo.\n\nESCALAMIENTO: contratar → margen → mercado → rumbo. Cada par sube de nivel. El último es el que duele.\n\nEL CIERRE ('lo de la derecha te lo cobras tú en horas') es la transferencia de autoridad que pide la estructura.", "referencia": "https://www.instagram.com/p/DZ_O7NAu1ZJ/", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S3-A12", "dia": "JUE 20 Ago", "fechaISO": "2026-08-20", "semana": 3, "idea": "Testimonio VAO: no sabíamos dónde estaban los contenedores", "tipo": "Reel", "formato": "Clip tratado · testimonio en marco · Estructura 33", "proposito": "Valor", "tablero": "Audiencia Avanzada", "bateria": "N3", "duracion": "~30 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"NO SABÍAMOS DÓNDE ESTABAN\"", "ganchoVisual": "Mismo tratamiento de la serie: fondo plano, marco pequeño abajo, cita arriba.", "guion": "[ALEXANDRA]\n\"No teníamos el control de nuestros contenedores.\"\n\"Manejamos alrededor de siete u ocho chóferes, y cada chófer tiene unos ocho o diez servicios al día.\"\n\"Los contenedores muchas veces pasaban meses y no sabíamos que estábamos allí.\"\n\n[JESSICA EN OFF]\nOchenta servicios al día en un Drive. Y una sola persona intentando saber dónde estaba cada cosa. No es desorden. Es que no da la vida.", "cta": "Si en tu empresa hay algo que solo sabe una persona, guarda esto. Es la conversación que toca tener en septiembre.", "notaJunior": "ESTRUCTURA 33 · ANÁLISIS DE CASO: gancho con misterio → contexto → punto de fricción → lección.\n\nRÓTULO: \"ASÍ ESTÁBAMOS ANTES · 03\".\n\nEL DATO QUE HACE LA PIEZA: 7-8 chóferes × 8-10 servicios = ~80 movimientos al día gestionados en un Drive por una persona. Ponerlo en pantalla.\n\nNO decir el nombre del software ni vender. La lección se entiende sola.\n\nFUENTE: testimonio grabado de Alexandra Elvira, Container VAO.", "referencia": "Testimonio grabado · Alexandra Elvira (Container VAO)", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S3-A13", "dia": "VIE 21 Ago", "fechaISO": "2026-08-21", "semana": 3, "idea": "Un clic y 7.500€ por minuto parado", "tipo": "Clip", "formato": "Clip de texto, sin Jessica · Estructura 23 · El Efecto Mariposa", "proposito": "Viral", "tablero": "Audiencia Media", "bateria": "N1", "duracion": "~29 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"7.500€ POR MINUTO PARADO\"", "ganchoVisual": "Sin Jessica. Secuencia de texto que escala: un clic → una hora → un día → seis meses. Ritmo ascendente.", "guion": "Un correo. Alguien de administración hace clic. Son las nueve y veinte de la mañana.\n\nA las nueve y media no se abre ningún archivo. A las diez nadie puede facturar.\n\nTener la empresa parada cuesta entre cuatro mil y siete mil quinientos euros por minuto. Por minuto.\n\nY el sesenta por ciento de las empresas que sufren un ataque grave no llega a los seis meses.\n\nTodo empieza en un clic de un martes cualquiera.", "cta": "Todo empieza en un clic de un martes cualquiera. Manda esto a quien abre los correos en tu empresa.", "notaJunior": "ESTRUCTURA 23 · EL EFECTO MARIPOSA: hecho pequeño → consecuencias gigantescas.\n\nNO NECESITA GRABACIÓN.\n\nLA ESCALADA TEMPORAL ES EL MECANISMO: 9:20 → 9:30 → 10:00 → seis meses. Respetar ese orden y ese ritmo.\n\nLA REPETICIÓN 'por minuto. Por minuto.' es deliberada. No quitarla.\n\nTEXTO EN PANTALLA: \"UN CLIC\" / \"4.000-7.500€ / MINUTO\" / \"60% NO LLEGA A 6 MESES\".\n\nFUENTE: Secure&IT, enero 2026.\n\nCTA de reenvío = compartidos.", "referencia": "Original", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},
{"id": "S4-A14", "dia": "LUN 24 Ago", "fechaISO": "2026-08-24", "semana": 4, "idea": "Fagor no quebró por dinero", "tipo": "Reel", "formato": "Talking head · Estructura 33 · Análisis de Caso", "proposito": "Viral", "tablero": "Audiencia Media", "bateria": "N2", "duracion": "~30 seg", "ganchoTextual": "TEXTO EN PANTALLA: \"FAGOR NO QUEBRÓ POR DINERO\"", "ganchoVisual": "Plano medio, fondo liso. Tono de quien cuenta algo, no de quien da una clase.", "guion": "Fagor estaba en la cocina de media España. Y quebró. Pero no por lo que crees.\n\nNo fue que dejaran de vender. Fue que el mercado cambió y ellos tardaron demasiado en darse cuenta.\n\nCada decisión tenía que pasar por tantas manos que para cuando salía, ya no servía. Rigidez, lo llaman los informes.\n\nY aquí está lo incómodo: eso mismo le pasa a una empresa de treinta personas. Si para cambiar un precio hacen falta cuatro días y tres correos, tienes el problema de Fagor a tu escala.", "cta": "¿Cuánto tarda tu empresa en tomar una decisión pequeña? Comenta el número de días.", "notaJunior": "ESTRUCTURA 33 · ANÁLISIS DE CASO ESTRATÉGICO.\n\nEL PUENTE ES LO IMPORTANTE: 'eso mismo le pasa a una empresa de treinta personas'. Sin ese puente es una anécdota de una empresa grande y no le habla a nadie.\n\nFUENTE: caso documentado. Fagor quebró en 2013 (cooperativa) y de nuevo en 2018 con el grupo CNA. Causa recogida en los análisis: rigidez organizativa, decisiones lentas, adaptación tardía al cambio de mercado.\n\nNO inventar cifras de Fagor. Solo el mecanismo, que sí está documentado.\n\nTEXTO EN PANTALLA: \"NO FUE POR VENTAS\" / \"FUE POR LENTITUD\".", "referencia": "Caso documentado · quiebra Fagor 2013", "quien": "Jessica", "musica": "Sin letra, muy bajo (que no tape la voz)", "urgente": false},

// STATE
// ═══════════════════════════════════════════════════════════
let data = [];
let activeTab = 'cal';
let activeFilters = {};
let currentDetailId = null;
let editMode = false;
let tpPlaying = false;
let tpRAF = null;
let tpPos = 0;
let tpSpeed = 3;
let tpMode = 'full';
let calWeekOffset = 0;

const DB_URL = 'https://fox-guiones-default-rtdb.firebaseio.com/guiones.json';

async function loadFromDB(){
  try{
    const res = await fetch(DB_URL);
    const saved = await res.json();
    if(Array.isArray(saved)) return saved;
    if(saved && typeof saved==='object') return Object.values(saved);
  }catch(e){}
  return null;
}

function saveData(){
  fetch(DB_URL,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  }).catch(e=>console.error('Error al guardar:',e));
  showSavedMsg();
}

function showSavedMsg(){
  const m = document.getElementById('savedMsg');
  if(m){m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2000);}
}

// ═══════════════════════════════════════════════════════════
// FILTER + SEARCH
// ═══════════════════════════════════════════════════════════
function getFilteredData(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return data.filter(p=>{
    if(activeTab==='jessica' && p.quien!=='Jessica') return false;
    if(activeTab==='junior' && p.quien!=='Junior') return false;
    if(activeTab==='s1' && p.semana!==1) return false;
    if(activeTab==='s2' && p.semana!==2) return false;
    if(activeTab==='s3' && p.semana!==3) return false;
    if(activeTab==='s4' && p.semana!==4) return false;
    if(activeTab==='s5' && p.semana!==5) return false;
    for(const [k,v] of Object.entries(activeFilters)){
      if(p[k]!==v) return false;
    }
    if(q){
      const searchable = [p.idea,p.ganchoTextual,p.guion,p.cta].join(' ').toLowerCase();
      if(!searchable.includes(q)) return false;
    }
    return true;
  });
}

// RENDER
// ═══════════════════════════════════════════════════════════
function renderAll(){
  updateStats();
  const filtered = getFilteredData();
  const main = document.getElementById('mainContent');
  if(!filtered.length){
    main.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><h3>No hay piezas</h3><p>Prueba cambiando los filtros o la búsqueda.</p></div>`;
    return;
  }
  // Group by semana (dynamic — supports any number of weeks)
  const bySemana = {};
  filtered.forEach(p=>{ const s=p.semana||1; (bySemana[s]=bySemana[s]||[]).push(p); });
  const semanas = Object.keys(bySemana).map(Number).sort((a,b)=>a-b);
  let html='';
  semanas.forEach(s=>{
    const pieces = bySemana[s];
    if(!pieces.length) return;
    const info = semanaInfo(s);
    html+=`<div class="semana-block">
      <div class="semana-header">
        <div>
          <div class="semana-label">${info.dates}</div>

function openTp(id){
  const p = data.find(x=>x.id===id);

  // Parse guion: remove [bracket] notes for clean reading
  const cleanText = p.guion
    .replace(/\[Texto en pantalla:[^\]]*\]/gi,'')
    .replace(/\[[^\]]*\]/g, m=>`<span class="nota">${m}</span>`)
    .trim();
  closeDetail();

  tpPos = 0;

  buildTpContent(cleanText);
  document.getElementById('tpOverlay').classList.add('active');
  document.body.style.overflow='hidden';
  document.addEventListener('keydown', tpKeyHandler);
}

function buildTpContent(html){
  const body = document.getElementById('tpBody');
  const modeClass = `mode-${tpMode}`;
  if(tpMode==='full'){
    body.className=`tp-body mode-full`;
    body.innerHTML=`<div class="tp-content-wrap"><div class="tp-scroller" id="tpScroller"><div class="tp-text" id="tpText">${html}</div><div class="tp-progress" id="tpProgress" style="width:0%"></div></div></div>`;
  } else if(tpMode==='ipad'){
    body.className=`tp-body mode-ipad`;
    body.innerHTML=`<div class="tp-device-frame"><div class="tp-content-wrap"><div class="tp-scroller" id="tpScroller"><div class="tp-text" id="tpText">${html}</div></div></div></div>`;
  } else {
    body.className=`tp-body mode-laptop`;
    body.innerHTML=`<div class="tp-device-outer"><div class="tp-device-screen"><div class="tp-content-wrap"><div class="tp-scroller" id="tpScroller"><div class="tp-text" id="tpText">${html}</div></div></div></div><div class="tp-device-base"></div></div>`;
  }
}

function setTpMode(mode, btn){
  tpMode = mode;
  document.querySelectorAll('.tp-device-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cur = document.getElementById('tpText');
  const html = cur ? cur.innerHTML : '';
  buildTpContent(html);
  tpPos = 0;
}

function toggleTp(){
  if(tpPlaying) pauseTp(); else playTp();
}

function playTp(){
  tpPlaying = true;
  document.getElementById('tpPlayBtn').textContent = '⏸ Pausar';
  scrollTp();
}

function pauseTp(){
  tpPlaying = false;
  document.getElementById('tpPlayBtn').textContent = '▶ Continuar';
  if(tpRAF) cancelAnimationFrame(tpRAF);
}

function scrollTp(){
  if(!tpPlaying) return;
  const scroller = document.getElementById('tpScroller');
  const text = document.getElementById('tpText');
  if(!scroller||!text) return;
  const maxScroll = text.scrollHeight - scroller.clientHeight;
  if(tpPos >= maxScroll){
    pauseTp();
    document.getElementById('tpPlayBtn').textContent = '↺ Reiniciar';
    document.getElementById('tpPlayBtn').onclick = ()=>{ tpPos=0; scroller.style.transform='translateY(0px)'; document.getElementById('tpPlayBtn').onclick=toggleTp; playTp(); };
    return;
  }
  tpPos += tpSpeed * 0.15;
  text.style.transform = `translateY(${-tpPos}px)`;
  const prog = document.getElementById('tpProgress');
  if(prog) prog.style.width = `${(tpPos/maxScroll)*100}%`;
  tpRAF = requestAnimationFrame(scrollTp);
}

function updateSpeed(){
  tpSpeed = parseInt(document.getElementById('tpSpeed').value)||3;
  document.getElementById('tpSpeedVal').textContent = tpSpeed;
}

function closeTp(){
  pauseTp();
  document.getElementById('tpOverlay').classList.remove('active');
  document.body.style.overflow='';
  document.removeEventListener('keydown', tpKeyHandler);
}

function tpKeyHandler(e){
  if(e.key===' '){e.preventDefault();toggleTp();}
  if(e.key==='Escape') closeTp();
  if(e.key==='ArrowUp'){tpPos=Math.max(0,tpPos-50);const t=document.getElementById('tpText');if(t)t.style.transform=`translateY(${-tpPos}px)`;}
  if(e.key==='ArrowDown'){tpPos+=50;const t=document.getElementById('tpText');if(t)t.style.transform=`translateY(${-tpPos}px)`;}
}

// ═══════════════════════════════════════════════════════════
// DATE UTILS
// ═══════════════════════════════════════════════════════════
function formatDia(isoStr){
  if(!isoStr) return '';
  const [y,m,d] = isoStr.split('-').map(Number);
  const date = new Date(y, m-1, d, 12);
  const dias = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${dias[date.getDay()]} ${d} ${meses[m-1]}`;
}

function parseDia(p){
  if(p.fechaISO) return new Date(p.fechaISO + 'T12:00:00');
  if(!p.dia) return null;
  const meses = {Ene:0,Feb:1,Mar:2,Abr:3,May:4,Jun:5,Jul:6,Ago:7,Sep:8,Oct:9,Nov:10,Dic:11};
  const parts = p.dia.trim().split(/\s+/);
  if(parts.length < 3) return null;
  const day = parseInt(parts[1]);
  const mon = meses[parts[2]];
  if(isNaN(day) || mon === undefined) return null;
  return new Date(2026, mon, day, 12, 0, 0);
}

// Project anchor: Monday 29 Jun 2026 = Semana 1 (julio arranca miércoles 1)
const WEEK1_MONDAY = new Date(2026,7,3,12,0,0);
const MESES_ABR = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Returns the semana number (1-based) for a given Date, Monday-anchored
function semanaFromDate(dt){
  const d = new Date(dt); d.setHours(12,0,0,0);
  const dow = (d.getDay()+6)%7; // 0=Mon … 6=Sun
  const monday = new Date(d); monday.setDate(d.getDate()-dow);
  const diffWeeks = Math.round((monday - WEEK1_MONDAY)/(7*86400000));
  return Math.max(1, diffWeeks + 1);
}

// Returns {name, dates} for a semana number (working range Lun–Vie)
function semanaInfo(s){
  const mon = new Date(WEEK1_MONDAY); mon.setDate(mon.getDate()+(s-1)*7);
  const fri = new Date(mon); fri.setDate(mon.getDate()+4);
  const dates = `${mon.getDate()} – ${fri.getDate()} ${MESES_ABR[fri.getMonth()]} ${fri.getFullYear()} · Lun–Vie`;
  const name = `Semana ${s}`;
  return {name, dates};
}

// Fallback-only: repack pieces onto weekdays (Lun–Vie), preserving order. Idempotent.
function normalizeWeekdays(arr){
  const dias=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const sorted=[...arr].sort((a,b)=>{
    const da=parseDia(a), db=parseDia(b);
    return (da?da.getTime():0)-(db?db.getTime():0);
  });
  let cur=parseDia(sorted[0])||new Date(2026,5,2,12,0,0);
  cur=new Date(cur); cur.setHours(12,0,0,0);
  sorted.forEach(p=>{
    while(cur.getDay()===0||cur.getDay()===6){ cur.setDate(cur.getDate()+1); }
    p.fechaISO=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
    p.dia=`${dias[cur.getDay()]} ${cur.getDate()} ${MESES_ABR[cur.getMonth()]}`;
    p.semana=semanaFromDate(cur);
    cur.setDate(cur.getDate()+1);
  });
  return arr;
}

// Reassign a piece to a specific ISO date (used by drag&drop)
function movePieceToDate(id, isoDate){
  const p = data.find(x=>x.id===id);
  if(!p) return;
  p.fechaISO = isoDate;
  p.dia = formatDia(isoDate);
  p.semana = semanaFromDate(new Date(isoDate+'T12:00:00'));

// ═══════════════════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════════════════
function getCalWeekStart(){
  const base = new Date();
  base.setHours(0,0,0,0);
  const day = base.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  base.setDate(base.getDate() + diff + calWeekOffset * 7);
  return base;
}

function renderCalendar(){
  const weekStart = getCalWeekStart();
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 6);
  const dayNames = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const mesesFull = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const today = new Date(); today.setHours(0,0,0,0);
  const fmtMonth = (d) => d.getMonth()===weekEnd.getMonth() ? '' : `${mesesFull[d.getMonth()]} `;
  const title = `${weekStart.getDate()} ${mesesFull[weekStart.getMonth()]} – ${weekEnd.getDate()} ${mesesFull[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;
  let html = `<div class="cal-nav">
    <div class="cal-nav-title">📅 ${title}</div>
    <div class="cal-nav-btns">
      <button class="btn btn-ghost btn-sm" onclick="calWeekOffset--;renderCalendar()">← Anterior</button>
      <button class="btn btn-ghost btn-sm" onclick="calWeekOffset=0;renderCalendar()">Hoy</button>
      <button class="btn btn-ghost btn-sm" onclick="calWeekOffset++;renderCalendar()">Siguiente →</button>
    </div>
  </div>
  <div class="cal-scroll"><div class="cal-week">`;
  for(let i=0;i<7;i++){
    const day = new Date(weekStart);
    day.setDate(day.getDate() + i);
    day.setHours(0,0,0,0);
    const isToday = day.getTime() === today.getTime();
    const isWeekend = (i>=5); // 5=Sáb, 6=Dom (cal-week empieza en Lunes)
    const iso = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
    const dayPieces = data.filter(p=>{
      const pd = parseDia(p);
      if(!pd) return false;
      const c = new Date(pd); c.setHours(0,0,0,0);
      return c.getTime() === day.getTime();
    });
    const addBtn = isWeekend ? '' : `<button class="cal-add-btn" title="Añadir contenido este día" onclick="event.stopPropagation();openAddModal('${iso}')">+</button>`;
    const dropAttrs = isWeekend ? '' : `ondragover="calDragOver(event)" ondragleave="calDragLeave(event)" ondrop="calDrop(event,'${iso}')"`;
    html += `<div class="cal-day${isWeekend?' cal-day-weekend':''}">
      <div class="cal-day-header${isWeekend?' weekend':''}">
        <div class="cal-day-name">${dayNames[i]}</div>
        <div class="cal-day-num${isToday?' today':''}">${day.getDate()}</div>
        ${addBtn}
      </div>
      <div class="cal-day-body${isWeekend?' weekend':''}" ${dropAttrs} data-iso="${iso}">`;
    if(isWeekend){
      html += `<div class="cal-libre">Libre<span>sin publicación</span></div>`;
    } else if(!dayPieces.length){
      html += `<div class="cal-empty">—</div>`;
    } else {
      dayPieces.forEach(p=>{
        const calClass = p.quien==='Jessica' ? 'jessica-cal' : 'junior-cal';
        html += `<div class="cal-card ${calClass}" draggable="true" data-id="${p.id}" ondragstart="calDragStart(event,'${p.id}')" ondragend="calDragEnd(event)" onclick="openDetail('${p.id}')">
          <div class="cal-card-tipo">${p.tipo} · ${p.quien}</div>
          <div class="cal-card-title">${esc(p.idea)}</div>
        </div>`;
      });
    }
    html += `</div></div>`;
  }
  html += `</div></div>`;
  document.getElementById('mainContent').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
// DRAG & DROP (calendario tipo Trello)
// ═══════════════════════════════════════════════════════════
let dragId = null;
function calDragStart(e, id){
  dragId = id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.classList.add('dragging');
}
function calDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.cal-day-body.drop-over').forEach(el=>el.classList.remove('drop-over'));
  dragId = null;
}
function calDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop-over');
}
function calDragLeave(e){
  e.currentTarget.classList.remove('drop-over');
}
function calDrop(e, iso){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-over');
  const id = dragId || e.dataTransfer.getData('text/plain');
  if(id) movePieceToDate(id, iso);
}

// ═══════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════
document.getElementById('navTabs').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-tab');
  if(!btn) return;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  if(activeTab==='cal') renderCalendar(); else renderAll();
});

document.getElementById('filterChips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const {filter, val} = chip.dataset;
  if(activeFilters[filter]===val){
    delete activeFilters[filter];
    chip.classList.remove('active');
  } else {
    // Remove other chips for same filter
    document.querySelectorAll(`.chip[data-filter="${filter}"]`).forEach(c=>c.classList.remove('active'));
    activeFilters[filter]=val;
    chip.classList.add('active');
  }
  renderAll();
});
