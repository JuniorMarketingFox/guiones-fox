<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX Analytics · Guiones Julio 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0F15;--surface:#161923;--surface2:#1E2230;--border:#272B3A;
  --text:#EEEEF0;--text2:#7A7D90;--text3:#4A4D60;
  --jessica:#10B981;--junior:#F59E0B;
  --reel:#8B5CF6;--clip:#EC4899;--carrusel:#3B82F6;
  --viral:#EF4444;--valor:#F59E0B;--venta:#10B981;
  --fria:#60A5FA;--media:#A78BFA;--avanzada:#F97316;--compra:#34D399;
  --n1:#6B7280;--n2:#3B82F6;--n3:#8B5CF6;--n4:#F59E0B;--n5:#EF4444;
  --accent:#6366F1;--accent2:#4F46E5;
  --radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;letter-spacing:-.5px}
.header-title{flex:1}
.header-title h1{font-size:16px;font-weight:700;color:var(--text)}
.header-title p{font-size:12px;color:var(--text2)}
.btn{border:none;cursor:pointer;border-radius:var(--radius-sm);font-size:13px;font-weight:600;padding:8px 16px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#EF444420;color:#EF4444;border:1px solid #EF444430}
.btn-danger:hover{background:#EF444430}

/* NAV TABS */
.nav-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav-tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--text2);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TOOLBAR */
.toolbar{padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px 8px 36px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stats-bar{display:flex;gap:16px;padding:0 24px 12px}
.stat{font-size:12px;color:var(--text2)}.stat span{color:var(--text);font-weight:700}

/* SEMANA HEADERS */
.semana-block{padding:0 24px 32px}
.semana-header{display:flex;align-items:center;gap:12px;padding:20px 0 14px;border-top:1px solid var(--border);margin-bottom:0}
.semana-header:first-child{border-top:none}
.semana-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.semana-title{font-size:18px;font-weight:800;color:var(--text)}
.semana-count{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--text2)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding-bottom:12px}

/* SECTION LABEL WITHIN SEMANA */
.section-label{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.section-label-text{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.section-line{flex:1;height:1px;background:var(--border)}
.jessica-section .section-label-text{color:var(--jessica)}
.junior-section .section-label-text{color:var(--junior)}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.15)}
.card.jessica-card{border-left:3px solid var(--jessica)}
.card.junior-card{border-left:3px solid var(--junior)}
.card.urgent{border-top:2px solid #EF4444}
.card-body{padding:14px}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.badge-reel{background:#8B5CF620;color:#8B5CF6;border:1px solid #8B5CF630}
.badge-clip{background:#EC489920;color:#EC4899;border:1px solid #EC489930}
.badge-carrusel{background:#3B82F620;color:#3B82F6;border:1px solid #3B82F630}
.badge-jessica{background:#10B98120;color:#10B981;border:1px solid #10B98130}
.badge-junior{background:#F59E0B20;color:#F59E0B;border:1px solid #F59E0B30}
.badge-viral{background:#EF444420;color:#EF4444}
.badge-valor{background:#F59E0B20;color:#F59E0B}
.badge-venta{background:#10B98120;color:#10B981}
.badge-urgente{background:#EF444420;color:#EF4444;border:1px solid #EF444430}
.badge-n1{background:#6B728020;color:#9CA3AF}
.badge-n2{background:#3B82F620;color:#93C5FD}
.badge-n3{background:#8B5CF620;color:#C4B5FD}
.badge-n4{background:#F59E0B20;color:#FCD34D}
.card-date{font-size:11px;color:var(--text3);margin-bottom:4px}
.card-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:8px}
.card-hook{font-size:12px;color:var(--text2);line-height:1.4;font-style:italic;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2)}
.card-tablero{font-size:11px;color:var(--text2)}
.card-actions{display:flex;gap:6px}
.icon-btn{width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;background:transparent;color:var(--text2)}
.icon-btn:hover{background:var(--border);color:var(--text)}
.icon-btn.teleprompter-btn{color:var(--jessica)}
.icon-btn.teleprompter-btn:hover{background:#10B98120}

/* MODAL OVERLAY */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(4px);padding:20px;overflow-y:auto}
.modal-overlay.active{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;margin:auto;overflow:hidden}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal-header-info{flex:1}
.modal-header h2{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-header-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-close{width:32px;height:32px;border:none;background:var(--surface2);border-radius:8px;cursor:pointer;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{color:var(--text);background:var(--border)}
.modal-body{padding:20px 24px}
.field{margin-bottom:16px}
.field-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.field-value{font-size:14px;color:var(--text);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.field-value.guion{font-family:'SF Mono','Fira Code',monospace;font-size:13px;white-space:pre-wrap;max-height:320px;overflow-y:auto;line-height:1.7}
.field textarea{width:100%;background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:13px;font-family:'SF Mono','Fira Code',monospace;line-height:1.7;resize:vertical;outline:none;white-space:pre-wrap}
.field textarea:focus{border-color:var(--accent)}
.field-link{color:#60A5FA;font-size:13px;text-decoration:none}
.field-link:hover{text-decoration:underline}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-footer .spacer{flex:1}
.music-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;color:var(--text);font-size:13px;outline:none;width:100%;margin-top:4px}
.music-input:focus{border-color:var(--accent)}
.saved-msg{font-size:12px;color:var(--jessica);display:none}
.saved-msg.show{display:block}

/* TELEPROMPTER */
.tp-overlay{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column}
.tp-overlay.active{display:flex}
.tp-controls{background:rgba(0,0,0,.9);border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px;z-index:2;flex-shrink:0}
.tp-btn{background:#1a1a1a;border:1px solid #333;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.tp-btn:hover{background:#2a2a2a}
.tp-btn.play-btn{background:var(--jessica);border-color:var(--jessica);min-width:90px}
.tp-btn.play-btn:hover{background:#0DA271}
.tp-back{background:transparent;border:1px solid #333;color:#888;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s}
.tp-back:hover{color:#fff;border-color:#555}
.tp-title{flex:1;font-size:13px;color:#888;text-align:center}
.speed-wrap{display:flex;align-items:center;gap:8px}
.speed-wrap label{font-size:11px;color:#666;white-space:nowrap}
.speed-wrap input[type=range]{width:100px;accent-color:var(--jessica)}
.speed-val{font-size:12px;color:var(--jessica);min-width:16px;text-align:center}
.tp-device-toggle{display:flex;gap:4px}
.tp-device-btn{background:#1a1a1a;border:1px solid #333;color:#666;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s}
.tp-device-btn.active{background:#2a2a2a;color:#fff;border-color:#555}
.tp-body{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
/* Fullscreen mode */
.tp-body.mode-full .tp-content-wrap{width:100%;max-width:800px;height:100%;overflow:hidden;position:relative}
/* iPad mode */
.tp-body.mode-ipad .tp-device-frame{width:320px;height:480px;border:8px solid #333;border-radius:28px;background:#000;overflow:hidden;box-shadow:0 0 0 2px #444,0 30px 80px rgba(0,0,0,.8);position:relative}
.tp-body.mode-ipad .tp-device-frame::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:60px;height:4px;background:#222;border-radius:4px;z-index:1}
.tp-body.mode-ipad .tp-content-wrap{position:absolute;inset:24px 0 0;overflow:hidden}
/* Laptop mode */
.tp-body.mode-laptop .tp-device-outer{position:relative}
.tp-body.mode-laptop .tp-device-screen{width:580px;height:380px;border:6px solid #2a2a2a;border-radius:12px 12px 0 0;background:#000;overflow:hidden;box-shadow:0 0 0 1px #444}
.tp-body.mode-laptop .tp-device-base{width:640px;height:20px;background:#2a2a2a;border-radius:0 0 8px 8px;margin-top:-1px}
.tp-body.mode-laptop .tp-device-base::after{content:'';display:block;width:120px;height:8px;background:#1a1a1a;border-radius:0 0 6px 6px;margin:0 auto}
.tp-body.mode-laptop .tp-content-wrap{position:absolute;inset:6px 6px 0;overflow:hidden}
/* CONTENT inside teleprompter */
.tp-scroller{height:100%;overflow:hidden;position:relative}
.tp-text{padding:40px 32px 200px;font-size:32px;font-weight:600;line-height:1.9;color:#fff;white-space:pre-wrap;will-change:transform}
.tp-body.mode-ipad .tp-text{font-size:18px;padding:20px 16px 120px;line-height:1.8}
.tp-body.mode-laptop .tp-text{font-size:24px;padding:30px 28px 200px;line-height:1.8}
.tp-text .nota{color:#555;font-size:.7em;font-style:italic}
.tp-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--jessica);transition:width .1s;z-index:3}
/* Line highlight overlay */
.tp-scroller::before{content:'';position:absolute;top:0;left:0;right:0;height:80px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);z-index:1;pointer-events:none}
.tp-scroller::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);z-index:1;pointer-events:none}

/* ADD MODAL */
.add-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;margin:auto;padding:24px;overflow:hidden}
.add-modal h3{font-size:16px;font-weight:800;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2)}
.form-field input,.form-field select,.form-field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;outline:none}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent)}
.form-field select option{background:var(--surface)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3A3D50}

/* UTILS */
.hidden{display:none!important}

/* CALENDAR VIEW */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 12px;flex-wrap:wrap;gap:8px}
.cal-nav-title{font-size:15px;font-weight:700;color:var(--text)}
.cal-nav-btns{display:flex;gap:8px}
.cal-scroll{overflow-x:auto;padding:0 24px 40px}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:910px}
.cal-day-header{padding:8px 10px 6px;background:var(--surface);border-radius:var(--radius-sm) var(--radius-sm) 0 0;border:1px solid var(--border);border-bottom:none;text-align:center}
.cal-day-name{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.cal-day-num{font-size:22px;font-weight:800;color:var(--text);line-height:1.2}
.cal-day-num.today{color:var(--accent)}
.cal-day-body{background:var(--surface2);border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:6px;min-height:80px;display:flex;flex-direction:column;gap:5px}
.cal-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 9px;cursor:pointer;transition:all .15s;border-left:3px solid var(--border)}
.cal-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.12)}
.cal-card.jessica-cal{border-left-color:var(--jessica)}
.cal-card.junior-cal{border-left-color:var(--junior)}
.cal-card-tipo{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text2);margin-bottom:2px}
.cal-card-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cal-empty{font-size:11px;color:var(--text3);text-align:center;padding:14px 4px}
/* day header with + button */
.cal-day-header{position:relative}
.cal-add-btn{position:absolute;top:6px;right:6px;width:20px;height:20px;border:none;border-radius:6px;background:var(--surface2);color:var(--text2);font-size:15px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s}
.cal-day:hover .cal-add-btn{opacity:1}
.cal-add-btn:hover{background:var(--accent);color:#fff}
/* weekend = Libre */
.cal-day-header.weekend{background:var(--surface);opacity:.55}
.cal-day-header.weekend .cal-day-name,.cal-day-header.weekend .cal-day-num{color:var(--text3)}
.cal-day-body.weekend{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,var(--surface2) 6px,var(--surface2) 7px);min-height:80px}
.cal-libre{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);text-align:center;padding:20px 4px;display:flex;flex-direction:column;gap:3px}
.cal-libre span{font-size:9px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text3);opacity:.7}
/* drag & drop */
.cal-card{cursor:grab}
.cal-card:active{cursor:grabbing}
.cal-card.dragging{opacity:.4;transform:scale(.97)}
.cal-day-body.drop-over{background:var(--accent);background:#6366F118;border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">FOX</div>
  <div class="header-title">
    <h1>Guiones · Julio 2026</h1>
    <p>23 piezas · 5 semanas (Lun–Vie) · Julio 2026</p>
  </div>
  <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇ Exportar</button>
  <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Añadir pieza</button>
</header>

<!-- NAVIGATION -->
<nav class="nav-wrap" id="navTabs">
  <button class="nav-tab active" data-tab="all">Todas (23)</button>
  <button class="nav-tab" data-tab="jessica">🎬 Jessica (0)</button>
  <button class="nav-tab" data-tab="junior">🎨 Junior (23)</button>
  <button class="nav-tab" data-tab="s1">Semana 1</button>
  <button class="nav-tab" data-tab="s2">Semana 2</button>
  <button class="nav-tab" data-tab="s3">Semana 3</button>
  <button class="nav-tab" data-tab="s4">Semana 4</button>
  <button class="nav-tab" data-tab="s5">Semana 5</button>
  <button class="nav-tab" data-tab="cal">📅 Calendario</button>
</nav>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar por título, gancho, idea..." oninput="renderAll()">
  </div>
  <div class="filters" id="filterChips">
    <button class="chip" data-filter="tipo" data-val="Reel">Reels</button>
    <button class="chip" data-filter="tipo" data-val="Clip">Clips</button>
    <button class="chip" data-filter="tipo" data-val="Carrusel">Carruseles</button>
    <button class="chip" data-filter="proposito" data-val="Viral">🔥 Viral</button>
    <button class="chip" data-filter="proposito" data-val="Valor">💡 Valor</button>
    <button class="chip" data-filter="proposito" data-val="Venta">💰 Venta</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat">Jessica <span id="stat-jessica">8</span></div>
  <div class="stat">Junior <span id="stat-junior">13</span></div>
  <div class="stat">Reels <span id="stat-reel">8</span></div>
  <div class="stat">Clips <span id="stat-clip">6</span></div>
  <div class="stat">Carruseles <span id="stat-carrusel">7</span></div>
</div>

<!-- MAIN CONTENT -->
<main id="mainContent" style="padding:0 24px 40px"></main>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" onclick="closeDetailIfOutside(event)">
  <div class="modal" id="detailModalInner">
    <div class="modal-header">
      <div class="modal-header-info">
        <h2 id="dTitle"></h2>
        <div class="modal-header-tags" id="dTags"></div>
      </div>

{"bateria": "N3", "cta": "¿Cuál te pegó más? Guárdalo y compártelo con otro dueño 👇", "dia": "MIÉ 15 Jul", "duracion": "—", "fechaISO": "2026-07-15", "formato": "12 slides (cover + 10 verdades + CTA)", "ganchoTextual": "COVER: \"10 verdades incómodas para dueños de empresa (la nº 10 te va a doler)\"", "ganchoVisual": "Cover oscuro, tipografía bold grande, número 10 destacado. Diseño limpio y serio.", "guion": "SLIDE 1 (COVER): 10 verdades incómodas para dueños de empresa. (la nº 10 te va a doler)\nSLIDE 2: 1. Si no llegas mañana y la empresa se para, no tienes una empresa, tienes un empleo muy caro.\nSLIDE 3: 2. El empleado ineficiente que aguantas ya te costó 6 meses más de lo que crees.\nSLIDE 4: 3. Vender más sin ordenar la operación es llenar una olla con un hueco.\nSLIDE 5: 4. Si no tienes claros tus números, estás decidiendo a ciegas.\nSLIDE 6: 5. El caos no es mala suerte. Es ausencia de proceso.\nSLIDE 7: 6. Si todo depende de una sola persona, tienes una bomba de tiempo, no un equipo.\nSLIDE 8: 7. Las fugas de dinero no están en lo grande, están en lo pequeño que nadie revisa.\nSLIDE 9: 8. Contratar por urgencia es el error más caro y más repetido.\nSLIDE 10: 9. Si tu equipo dejó de darte feedback, es porque aprendió que no servía de nada.\nSLIDE 11: 10. Tu empresa no tiene un problema de ventas. Tiene un problema de dueño.\nSLIDE 12 (CTA): ¿Cuál te pegó más? Guárdalo si necesitas leerlo otra vez 👇", "id": "S3-C01", "idea": "#19 reaprovechado — Carrusel 10 verdades incómodas", "musica": "", "notaJunior": "Mismo contenido que el reel #19 — cero idea nueva, solo cambia el formato (cubre cuota de carrusel). Una verdad por slide, tipografía grande y legible, fondo oscuro y serio. La verdad nº 10 es el remate más fuerte: dale el slide más contundente. Mantener orden de intensidad creciente. Coherente con el brandkit FOX.", "proposito": "Valor", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DXjztcwjXdW/", "semana": 3, "tablero": "Audiencia Media", "tipo": "Carrusel", "urgente": false},
{"bateria": "N4", "cta": "¿Qué proceso de tu empresa tiene pasos que sobran? 👇", "dia": "JUE 16 Jul", "duracion": "~30-35 seg", "fechaISO": "2026-07-16", "formato": "Talking head", "ganchoTextual": "\"El error más caro que veo en empresas que crecen: contratar más gente cuando lo que hay es desorden.\"", "ganchoVisual": "Talking head limpio, oficina. Arranca en frío con el error, sin intro.", "guion": "\"El error más caro que veo en empresas que crecen: contratar más gente cuando lo que hay es desorden.\nPorque más gente sobre un proceso desordenado no lo ordena. Lo encarece.\nMás manos significa más gente chocándose, más gente esperando a que otro haga algo.\nDisparas los costes fijos sin mejorar nada para el cliente.\nLa rentabilidad no se encuentra contratando manos. Se encuentra eliminando los pasos que sobran.\nPor eso, antes de pagar por un CRM que no encaja con tu proceso, hay que entender cómo opera de verdad tu negocio.\nEso es lo que construimos antes de escribir una sola línea de código.\"", "id": "S3-J11", "idea": "#21 — Procesos antes que tecnología", "musica": "Sobria, baja", "notaJunior": "Calcar el argumento causa-efecto de la referencia (desorden → más gente → más costo → peor experiencia → menos rentabilidad); solo cambiamos el cierre hacia la lógica de desarrollo de software. Arranca en frío. Enfocar desde RENTABILIDAD, no sonar vendedor: el cierre es casi calco del vehículo único de FOX, dicho como conclusión natural. Tono firme.", "proposito": "Valor", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DYSOrjMDfxP/", "semana": 3, "tablero": "Audiencia Media", "tipo": "Reel", "urgente": false},
{"bateria": "N4", "cta": "¿Qué es lo que todavía no has soltado en tu empresa? 👇", "dia": "VIE 17 Jul", "duracion": "~30-35 seg", "fechaISO": "2026-07-17", "formato": "Talking head", "ganchoTextual": "\"Al principio el CEO lo hace todo.\" (arranca en frío)", "ganchoVisual": "Talking head cercano, tono cómplice. Puede intercalar B-roll de alguien haciendo mil cosas (factura, atiende, etc.).", "guion": "\"Al principio el CEO lo hace todo.\nFactura, vende, atiende, apaga incendios, y si hace falta hasta trapea la oficina.\nY está bien — así arrancan todas las empresas. Ese 'yo me encargo' es lo que la saca adelante.\nEl problema es cuando ese 'yo me encargo' deja de ser una virtud… y se vuelve el techo de tu empresa.\nPorque si todo lo sostienes tú, tu empresa no puede crecer más de lo que tú aguantes.\nEn algún momento el trabajo deja de ser hacerlo todo. Y pasa a ser construir el sistema que lo hace sin ti.\"", "id": "S3-J12", "idea": "#18 — Qué es un CEO (el 'yo me encargo' que se vuelve techo)", "musica": "Cálida que sube un punto en el cierre", "notaJunior": "La referencia define al 'Founder CEO' como el todólogo obsesivo ('yo me encargo, yo lo hago'). Tomamos esa energía pero giramos al ángulo aprobado: ese 'yo me encargo' empieza como virtud y termina siendo el techo/cuello de botella. Tono cómplice, identificable, NADA de regañar: primero se valida ('así arrancan todas'), luego se abre los ojos. Opcional B-roll haciendo mil tareas. El cierre conecta con FOX sin nombrar el producto.", "proposito": "Viral/Valor", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DTjdYCqAn57/", "semana": 3, "tablero": "Audiencia Media", "tipo": "Reel", "urgente": false},
{"bateria": "N4", "cta": "¿Cuál de las tres te quita más tiempo hoy? 👇", "dia": "LUN 20 Jul", "duracion": "~35-40 seg", "fechaISO": "2026-07-20", "formato": "Talking head → pantalla dividida con la solución aplicada", "ganchoTextual": "\"Las tres cosas que toda pyme termina queriendo automatizar son siempre las mismas.\"", "ganchoVisual": "Talking head que luego pasa a pantalla dividida mostrando la solución/caso real.", "guion": "\"Si tuviera que decir las tres cosas que toda pyme termina queriendo automatizar, son siempre las mismas:\nUna: facturación y cobros.\nDos: el seguimiento de leads — dejar de perder al cliente que escribió y nadie le contestó a tiempo.\nTres: la atención al cliente.\n¿Y cuánto cambia eso de verdad? No te voy a dar un porcentaje de internet.\nTe doy un caso real: VAO llevaba 200 contenedores en un Excel, a mano. Hoy los ve por GPS, en tiempo real. Lo construimos en 3-4 semanas.\nCoopertus pasaba 15 días al mes cuadrando Excel para las nóminas. Hoy es un sistema.\nEso no es un porcentaje. Es tiempo de vida que te devuelven.\"", "id": "S4-J13", "idea": "#7 — Las 3 automatizaciones que toda pyme termina queriendo", "musica": "Corporativa con corte al pasar a pantalla dividida", "notaJunior": "⚠️ ANTI-ERROR: NO usar cifras de '% de mejora' de internet (salen de blogs de agencias, inverificables, la skill las prohíbe). Lo sólido: las 3 automatizaciones más buscadas (facturación, leads, atención) + casos REALES de FOX (VAO, Coopertus) con cifras propias. Estructura: talking head para el 'qué' → pantalla dividida con el caso para el 'cuánto cambia'. Cierre ('tiempo de vida') es remate emocional, no un número.", "proposito": "Valor", "quien": "Junior", "referencia": "Original", "semana": 4, "tablero": "Audiencia Media", "tipo": "Reel", "urgente": false},
{"bateria": "N4", "cta": "¿Cuál te dolió? Te leo abajo 👇", "dia": "MAR 21 Jul", "duracion": "~55-60 seg", "fechaISO": "2026-07-21", "formato": "Dinámico, temporizador en pantalla, talking head rápido", "ganchoTextual": "\"60 segundos de verdades incómodas para dueños de empresa.\"", "ganchoVisual": "Temporizador visible corriendo. Talking head rápido, formato dinámico, sin pausas largas.", "guion": "\"60 segundos de verdades incómodas para dueños de empresa.\n1. Si no llegas mañana y la empresa se para, no tienes una empresa, tienes un empleo muy caro.\n2. El empleado ineficiente que aguantas ya te costó 6 meses más de lo que crees.\n3. Vender más sin ordenar la operación es llenar una olla con un hueco.\n4. Si no tienes claros tus números, estás decidiendo a ciegas.\n5. El caos no es mala suerte. Es ausencia de proceso.\n6. Si todo depende de una sola persona, tienes una bomba de tiempo.\n7. Las fugas de dinero no están en lo grande, están en lo pequeño que nadie revisa.\n8. Contratar por urgencia es el error más caro y más repetido.\n9. Si tu equipo dejó de darte feedback, es porque aprendió que no servía de nada.\n10. Tu empresa no tiene un problema de ventas. Tiene un problema de dueño.\nY la última… no sigas esta cuenta.\"", "id": "S4-J14", "idea": "#19 — 60 segundos de verdades incómodas (temporizador)", "musica": "Beat con tensión que acompaña el temporizador", "notaJunior": "Calcar el mecanismo: temporizador visible (urgencia) + ritmo rápido SIN pausas + NO explicar cada verdad (obliga a quedarse hasta el final). 10 verdades, la última como broma/cierre ('no sigas esta cuenta') igual que la referencia. Las 3 primeras conectan con el dolor de Antonio. Energía alta, rápido pero claro. Comparte contenido con el carrusel S3-C01 a propósito.", "proposito": "Viral", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DXjztcwjXdW/", "semana": 4, "tablero": "Audiencia Media", "tipo": "Reel", "urgente": false},
{"bateria": "N4", "cta": "¿Con cuál estás trabajando hoy? 👇", "dia": "MIÉ 22 Jul", "duracion": "~35-40 seg", "fechaISO": "2026-07-22", "formato": "3 categorías fijas arriba, rondas de comparación", "ganchoTextual": "TEXTO ARRIBA (desde el segundo 1): \"Freelance · SaaS genérico · Software a medida\"", "ganchoVisual": "Las 3 categorías fijas arriba desde el inicio, Jessica centrada. Avanza en rondas comparando el mismo criterio en las 3 a la vez.", "guion": "(Arriba fijo: FREELANCE · SAAS GENÉRICO · SOFTWARE A MEDIDA)\n\nRONDA 1 — qué resuelve cada uno:\nEl freelance resuelve una tarea suelta. El SaaS genérico resuelve lo que le sirve a todos. El software a medida resuelve TU proceso exacto.\n\nRONDA 2 — qué te exige:\nEl freelance, estar siempre encima. El SaaS, que tú te adaptes a él. El a medida, contar bien cómo trabajas. Una vez.\n\nRONDA 3 — qué te cuesta a largo plazo:\nEl freelance se va, y se lleva el cómo. El SaaS te cobra para siempre por lo que no usas, y nunca encaja del todo. El a medida es una inversión arriba que deja de costarte después.\n\nNo te digo cuál. Te digo que, según tu etapa, uno de estos te está frenando ahora mismo.", "id": "S4-J15", "idea": "#14 — Freelance vs SaaS genérico vs Software a medida", "musica": "Rítmica con corte por ronda", "notaJunior": "Mecanismo clave: estructura de RONDAS — cada criterio comparado en las 3 categorías AL MISMO TIEMPO, no una categoría completa y luego otra. Las 3 categorías fijas arriba desde el segundo 1. NO declarar ganador explícito (como la referencia): dejar que la comparación hable y cerrar con 'uno de estos te está frenando'. Versión a 3 vías del 'Versus de Nivel Estratégico' ya documentado.", "proposito": "Valor", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DY-Eng1RP6x/", "semana": 4, "tablero": "Audiencia Media", "tipo": "Reel", "urgente": false},
{"bateria": "N4", "cta": "Comenta AUTOMATIZACIÓN y te envío el informe 👇", "dia": "JUE 23 Jul", "duracion": "~30-35 seg", "fechaISO": "2026-07-23", "formato": "Talking head estático, oficina, escalera de señales + CTA comentario", "ganchoTextual": "\"Si tu empresa tiene estas señales, ya deberías estar automatizando.\" (arranca en frío)", "ganchoVisual": "Talking head con cámara estática, un solo lugar fijo todo el video, oficina de fondo (da seriedad/autoridad).", "guion": "\"Si tu empresa tiene estas señales, ya deberías estar automatizando.\nSeñal 1: todos los días haces las mismas tareas repetitivas a mano.\nSeñal 2: tienes leads, pero no alcanzas a contactarlos a tiempo — y otro ya está cerrando esa venta por ti.\nSeñal 3: si olvidaste el seguimiento, ya perdiste al cliente.\nSeñal 4: tu equipo está ocupado todo el día… pero ocupado no es lo mismo que produciendo.\nSeñal 5, la más cara: contrataste más gente, subió tu costo, y sigues sin ver resultados.\nSi te identificaste, no necesitas más manos. Necesitas un sistema.\nComenta AUTOMATIZACIÓN y te paso el informe con las señales reales y por dónde empezar.\"", "id": "S4-J16", "idea": "#9 — Señales de que ya deberías automatizar (lead magnet)", "musica": "Sobria, baja, profesional", "notaJunior": "Calcar el formato: cámara FIJA, un solo lugar, oficina de fondo (la estática da autoridad). Escalera de señales que sube de intensidad hasta la más dolorosa (contratar sin resultados). Conecta con el lead magnet de la ronda pasada: CTA 'comenta AUTOMATIZACIÓN' → informe Kit Digital + señales reales (INE/Eurostat). Es Venta vía lead magnet, no software de frente. El carrusel S5-C02 reaprovecha estas señales.", "proposito": "Venta", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DYC177zuGm6/", "semana": 4, "tablero": "Audiencia Avanzada", "tipo": "Reel", "urgente": false},
{"bateria": "N4", "cta": "¿Qué tarea de Excel te roba más horas a la semana? 👇", "dia": "VIE 24 Jul", "duracion": "~30-35 seg", "fechaISO": "2026-07-24", "formato": "Talking head, problema (Excel/fórmulas a mano) → solución (sistema FOX)", "ganchoTextual": "\"¿Todavía haces fórmulas en Excel a mano, como si fuera 1492?\" (arranca en frío)", "ganchoVisual": "Talking head + pantalla. Mantener el gancho fuerte del Excel. Mostrar el RESULTADO del sistema FOX en pantalla, no un tutorial.", "guion": "\"¿Todavía haces fórmulas en Excel a mano, como si fuera 1492?\nBuscar V, SI anidados, fórmulas que se rompen cuando alguien mueve una celda…\nLa verdad es que hoy eso ya no hace falta.\nPero no te voy a decir 'aprende a usar tal inteligencia artificial'. Porque mañana cambias de Excel y vuelves a empezar de cero.\nLo que hicimos para un cliente fue otra cosa: un sistema que lee solo los comentarios de sus clientes, los analiza, y le avisa cuando hay un patrón — sin que él toque una sola fórmula.\nEl Excel no es el problema. El problema es seguir haciendo a mano lo que ya puede hacerse solo.\"", "id": "S4-J17", "idea": "#13 — Excel + IA → el reframe importante", "musica": "Sube en la transición problema→solución", "notaJunior": "⚠️ ANTI-ERROR (tu duda): NO convertirlo en tutorial de 'usa esta IA tú mismo'. Si el giro es 'aprende a usar Claude', el espectador concluye que no necesita pagar un desarrollo — resta valor a FOX. Mantener el gancho de apertura (Excel 'como en 1492') pero resolver mostrando el RESULTADO del sistema de FOX en pantalla, no una herramienta externa gratuita. El contraste 'antes/ahora' es de los ganchos visuales más fuertes.", "proposito": "Venta", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DU1mMgzkuWR/", "semana": 4, "tablero": "Audiencia Avanzada", "tipo": "Reel", "urgente": false},
{"bateria": "N3", "cta": "Comenta AUTOMATIZACIÓN y te envío el informe 👇", "dia": "LUN 27 Jul", "duracion": "—", "fechaISO": "2026-07-27", "formato": "8 slides (cover + 5 señales + puente Kit Digital + CTA)", "ganchoTextual": "COVER: \"5 señales de que tu empresa ya debería estar automatizando\"", "ganchoVisual": "Cover con el número 5 grande, fondo oscuro, tipografía bold.", "guion": "SLIDE 1 (COVER): 5 señales de que tu empresa ya debería estar automatizando 👇\nSLIDE 2: 1. Haces las mismas tareas repetitivas a mano, todos los días.\nSLIDE 3: 2. Tienes leads, pero no los contactas a tiempo — y otro cierra por ti.\nSLIDE 4: 3. Olvidaste el seguimiento una vez. Ahí perdiste al cliente.\nSLIDE 5: 4. Tu equipo está ocupado todo el día. Pero ocupado no es producir.\nSLIDE 6: 5. Contrataste más gente, subió el costo, y sigues sin ver resultados.\nSLIDE 7 (PUENTE): El Kit Digital cerró en octubre de 2025. El siguiente nivel no es otra subvención — es un sistema hecho para ti.\nSLIDE 8 (CTA): Comenta AUTOMATIZACIÓN y te paso el informe con las señales reales + por dónde empezar.", "id": "S5-C02", "idea": "#9 reaprovechado — Carrusel 5 señales + Kit Digital (lead magnet)", "musica": "", "notaJunior": "Reaprovecha las 5 señales del reel #9 (cero idea nueva) en carrusel — cubre cuota de carrusel y refuerza el lead magnet para quien no ve reels. El slide 7 (puente) conecta con el dolor del Kit Digital cerrado → siguiente nivel. Diseño limpio del brandkit FOX, una señal por slide. Venta vía lead magnet, no software directo.", "proposito": "Venta", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DYC177zuGm6/", "semana": 5, "tablero": "Audiencia Avanzada", "tipo": "Carrusel", "urgente": false},
{"bateria": "N4", "cta": "¿Cuánto tardas tú en que alguien nuevo rinda? 👇", "dia": "MAR 28 Jul", "duracion": "~35-40 seg", "fechaISO": "2026-07-28", "formato": "Talking head / B-roll", "ganchoTextual": "\"La mayoría pierde 3 meses esperando a que el nuevo agarre el ritmo.\" (arranca en frío)", "ganchoVisual": "Talking head limpio. Puede intercalar B-roll de onboarding (escritorio nuevo, PDFs, etc.).", "guion": "\"La mayoría pierde 3 meses esperando a que el nuevo agarre el ritmo.\nY esos 3 meses no son culpa de la persona. Son culpa de que no hay un proceso.\nLe das acceso, le presentas al equipo, le mandas unos PDFs y 'échale ganas, ahí está todo'. Y esperas.\nA que aprenda solo. A que copie a los demás. A que agarre el ritmo.\nA los 90 días te preguntas por qué todavía no rinde.\nLa verdad: nunca tuviste un sistema para convertirlo en alguien productivo.\nUna persona nueva no necesita tiempo para agarrar el ritmo. Necesita un sistema que le muestre cuál es el ritmo desde el día uno.\nEso separa a las empresas que escalan de las que siempre están empezando de cero con gente nueva.\"", "id": "S5-J18", "idea": "#20 — Por qué pierdes 3 meses con cada persona nueva", "musica": "Sobria", "notaJunior": "⚠️ ANTI-ERROR: prohibido decir 'nearshore/offshore/outsourcing' frente a cámara. Habla de la LÓGICA de gestión de equipos (el onboarding), NO del modelo de negocio de FOX (equipo Barcelona-Bogotá). No tocar el modelo. Calcar el argumento: los 3 meses perdidos no son culpa de la persona, son culpa del proceso; el sistema da el ritmo desde el día 1. Arranca en frío. Tono de quien lo ha visto repetirse.", "proposito": "Viral", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DZJfrQFxTt6/", "semana": 5, "tablero": "Audiencia Media", "tipo": "Reel", "urgente": false},
{"bateria": "N5", "cta": "¿Ya sabes cómo vas a cumplir con Verifactu? Escríbenos 👇", "dia": "MIÉ 29 Jul", "duracion": "~40-50 seg", "fechaISO": "2026-07-29", "formato": "Entrevista (Jessica entrevista a Andrés) + sistema en pantalla", "ganchoTextual": "\"Verifactu va a ser obligatorio, y mucha gente todavía no sabe qué hacer.\" (arranca en frío)", "ganchoVisual": "Formato entrevista: Jessica pregunta, Andrés responde. Intercalar pantalla mostrando el sistema funcionando (sin tecnicismos visibles).", "guion": "JESSICA: \"Verifactu va a ser obligatorio, y mucha gente todavía no sabe qué hacer. Se lo pregunté a Andrés, que lo implementó para un cliente. Sin tecnicismos: ¿qué cambió para ese cliente?\"\nANDRÉS: \"Antes facturaba y ya. Ahora cada factura tiene que validarse y quedar registrada de una forma específica para Hacienda. Nosotros construimos eso dentro de su propio sistema, sin que él tuviera que cambiar cómo trabaja.\"\nJESSICA: \"¿Y por qué no esperar al último momento?\"\nANDRÉS: \"Porque cuando algo es obligatorio, todos corren a la vez. Este cliente lo resolvió antes y se quitó el problema de encima.\"\nJESSICA: \"Si esto te suena, escríbenos antes de que sea una urgencia.\"", "id": "S5-J19", "idea": "#11 — Cómo implementamos Verifactu (entrevista a Andrés)", "musica": "Baja, seria, profesional", "notaJunior": "El ángulo invierte la referencia: en vez de la TEORÍA de Verifactu (ya está en internet), 'cómo lo implementamos NOSOTROS' con caso real — la entrevista al equipo técnico da peso. Usar el trigger de compra REAL (Verifactu, deadline antes de 2027; ya cerramos un cliente por esto). ⚠️ NUNCA nombrar frameworks/APIs frente a cámara: Andrés habla en lenguaje de negocio. Mostrar el sistema en pantalla. CTA de contacto directo (Venta). LOGÍSTICA: coordinar agenda con Andrés, no depende de Jessica sola.", "proposito": "Venta", "quien": "Junior", "referencia": "https://www.instagram.com/reel/DG3ErMjvZ2u/", "semana": 5, "tablero": "Listo para Comprar", "tipo const DB_URL = 'https://fox-guiones-default-rtdb.firebaseio.com/guiones.json';

async function loadFromDB(){
  try{
    const res = await fetch(DB_URL);
    const saved = await res.json();
    if(Array.isArray(saved)) return saved;
    if(saved && typeof saved==='object') return Object.values(saved);
  }catch(e){}
  return null;
}

function saveData(){
  fetch(DB_URL,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  }).catch(e=>console.error('Error al guardar:',e));
  showSavedMsg();
}

function showSavedMsg(){
  const m = document.getElementById('savedMsg');

function getFilteredData(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return data.filter(p=>{
    if(activeTab==='jessica' && p.quien!=='Jessica') return false;
    if(activeTab==='junior' && p.quien!=='Junior') return false;
    if(activeTab==='s1' && p.semana!==1) return false;
    if(activeTab==='s2' && p.semana!==2) return false;
    if(activeTab==='s3' && p.semana!==3) return false;
    if(activeTab==='s4' && p.semana!==4) return false;
    if(activeTab==='s5' && p.semana!==5) return false;
    for(const [k,v] of Object.entries(activeFilters)){
      if(p[k]!==v) return false;
    }
    if(q){
      const searchable = [p.idea,p.ganchoTextual,p.guion,p.cta].join(' ').toLowerCase();
      if(!searchable.includes(q)) return false;
    }
    return true;
  });
}

  document.addEventListener('keydown', tpKeyHandler);
}

function buildTpContent(html){
  const body = document.getElementById('tpBody');
  const modeClass = `mode-${tpMode}`;
  if(tpMode==='full'){
    body.className=`tp-body mode-full`;
    body.innerHTML=`<div class="tp-content-wrap"><div class="tp-scroller" id="tpScroller"><div class="tp-text" id="tpText">${html}</div><div class="tp-progress" id="tpProgress" style="width:0%"></div></div></div>`;
  } else if(tpMode==='ipad'){
    body.className=`tp-body mode-ipad`;
    body.innerHTML=`<div class="tp-device-frame"><div class="tp-content-wrap"><div class="tp-scroller" id="tpScroller"><div class="tp-text" id="tpText">${html}</div></div></div></div>`;
  } else {
    body.className=`tp-body mode-laptop`;
    body.innerHTML=`<div class="tp-device-outer"><div class="tp-device-screen"><div class="tp-content-wrap"><div class="tp-scroller" id="tpScroller"><div class="tp-text" id="tpText">${html}</div></div></div></div><div class="tp-device-base"></div></div>`;
  }
}

function setTpMode(mode, btn){
  tpMode = mode;
  document.querySelectorAll('.tp-device-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cur = document.getElementById('tpText');
  const html = cur ? cur.innerHTML : '';
  buildTpContent(html);
  tpPos = 0;
}

function toggleTp(){
  if(tpPlaying) pauseTp(); else playTp();
}

function playTp(){
  tpPlaying = true;
  document.getElementById('tpPlayBtn').textContent = '⏸ Pausar';
  scrollTp();
}

function pauseTp(){
  tpPlaying = false;
  document.getElementById('tpPlayBtn').textContent = '▶ Continuar';
  if(tpRAF) cancelAnimationFrame(tpRAF);
}

function scrollTp(){
  if(!tpPlaying) return;
  const scroller = document.getElementById('tpScroller');
  const text = document.getElementById('tpText');
  if(!scroller||!text) return;
  const maxScroll = text.scrollHeight - scroller.clientHeight;
  if(tpPos >= maxScroll){
    pauseTp();
    document.getElementById('tpPlayBtn').textContent = '↺ Reiniciar';
    document.getElementById('tpPlayBtn').onclick = ()=>{ tpPos=0; scroller.style.transform='translateY(0px)'; document.getElementById('tpPlayBtn').onclick=toggleTp; playTp(); };
    return;
  }
  tpPos += tpSpeed * 0.15;
  text.style.transform = `translateY(${-tpPos}px)`;
  const prog = document.getElementById('tpProgress');
  if(prog) prog.style.width = `${(tpPos/maxScroll)*100}%`;
  tpRAF = requestAnimationFrame(scrollTp);
}

function updateSpeed(){
  tpSpeed = parseInt(document.getElementById('tpSpeed').value)||3;
  document.getElementById('tpSpeedVal').textContent = tpSpeed;
}

function closeTp(){
  pauseTp();
  document.getElementById('tpOverlay').classList.remove('active');
  document.body.style.overflow='';
  document.removeEventListener('keydown', tpKeyHandler);
}

function tpKeyHandler(e){
  if(e.key===' '){e.preventDefault();toggleTp();}
  if(e.key==='Escape') closeTp();
  if(e.key==='ArrowUp'){tpPos=Math.max(0,tpPos-50);const t=document.getElementById('tpText');if(t)t.style.transform=`translateY(${-tpPos}px)`;}
  if(e.key==='ArrowDown'){tpPos+=50;const t=document.getElementById('tpText');if(t)t.style.transform=`translateY(${-tpPos}px)`;}
}

function esc(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════════
// DATE UTILS
// ═══════════════════════════════════════════════════════════
function formatDia(isoStr){
  if(!isoStr) return '';
  const [y,m,d] = isoStr.split('-').map(Number);
  const date = new Date(y, m-1, d, 12);
  const dias = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${dias[date.getDay()]} ${d} ${meses[m-1]}`;
}

function parseDia(p){
  if(p.fechaISO) return new Date(p.fechaISO + 'T12:00:00');
  if(!p.dia) return null;
  const meses = {Ene:0,Feb:1,Mar:2,Abr:3,May:4,Jun:5,Jul:6,Ago:7,Sep:8,Oct:9,Nov:10,Dic:11};
  const parts = p.dia.trim().split(/\s+/);
  if(parts.length < 3) return null;
  const day = parseInt(parts[1]);
  const mon = meses[parts[2]];
  if(isNaN(day) || mon === undefined) return null;
  return new Date(2026, mon, day, 12, 0, 0);
}

// Project anchor: Monday 29 Jun 2026 = Semana 1 (julio arranca miércoles 1)
const WEEK1_MONDAY = new Date(2026,5,29,12,0,0);
const MESES_ABR = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Returns the semana number (1-based) for a given Date, Monday-anchored
function semanaFromDate(dt){
  const d = new Date(dt); d.setHours(12,0,0,0);
  const dow = (d.getDay()+6)%7; // 0=Mon … 6=Sun
  const monday = new Date(d); monday.setDate(d.getDate()-dow);
  const diffWeeks = Math.round((monday - WEEK1_MONDAY)/(7*86400000));
  return Math.max(1, diffWeeks + 1);
}

// Returns {name, dates} for a semana number (working range Lun–Vie)
function semanaInfo(s){
  const mon = new Date(WEEK1_MONDAY); mon.setDate(mon.getDate()+(s-1)*7);
  const fri = new Date(mon); fri.setDate(mon.getDate()+4);
  const dates = `${mon.getDate()} – ${fri.getDate()} ${MESES_ABR[fri.getMonth()]} ${fri.getFullYear()} · Lun–Vie`;
  const name = `Semana ${s}`;
  return {name, dates};
}

// Fallback-only: repack pieces onto weekdays (Lun–Vie), preserving order. Idempotent.
function normalizeWeekdays(arr){
  const dias=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const sorted=[...arr].sort((a,b)=>{
    const da=parseDia(a), db=parseDia(b);
    return (da?da.getTime():0)-(db?db.getTime():0);
  });
  let cur=parseDia(sorted[0])||new Date(2026,5,2,12,0,0);
  cur=new Date(cur); cur.setHours(12,0,0,0);
  sorted.forEach(p=>{
    while(cur.getDay()===0||cur.getDay()===6){ cur.setDate(cur.getDate()+1); }
    p.fechaISO=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
    p.dia=`${dias[cur.getDay()]} ${cur.getDate()} ${MESES_ABR[cur.getMonth()]}`;
    p.semana=semanaFromDate(cur);
    cur.setDate(cur.getDate()+1);
  });
  return arr;
}

// Reassign a piece to a specific ISO date (used by drag&drop)
function movePieceToDate(id, isoDate){
  const p = data.find(x=>x.id===id);
  if(!p) return;
  p.fechaISO = isoDate;
  p.dia = formatDia(isoDate);
  p.semana = semanaFromDate(new Date(isoDate+'T12:00:00'));
  saveData();
  renderCalendar();
}

// ═══════════════════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════════════════
function getCalWeekStart(){
  const base = new Date();
  base.setHours(0,0,0,0);
  const day = base.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  base.setDate(base.getDate() + diff + calWeekOffset * 7);
  return base;
}

function renderCalendar(){
  const weekStart = getCalWeekStart();
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 6);
  const dayNames = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const mesesFull = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const today = new Date(); today.setHours(0,0,0,0);
  const fmtMonth = (d) => d.getMonth()===weekEnd.getMonth() ? '' : `${mesesFull[d.getMonth()]} `;
  const title = `${weekStart.getDate()} ${mesesFull[weekStart.getMonth()]} – ${weekEnd.getDate()} ${mesesFull[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;
  let html = `<div class="cal-nav">
    <div class="cal-nav-title">📅 ${title}</div>
    <div class="cal-nav-btns">
      <button class="btn btn-ghost btn-sm" onclick="calWeekOffset--;renderCalendar()">← Anterior</button>
      <button class="btn btn-ghost btn-sm" onclick="calWeekOffset=0;renderCalendar()">Hoy</button>
      <button class="btn btn-ghost btn-sm" onclick="calWeekOffset++;renderCalendar()">Siguiente →</button>
    </div>
  </div>
  <div class="cal-scroll"><div class="cal-week">`;
  for(let i=0;i<7;i++){
    const day = new Date(weekStart);
    day.setDate(day.getDate() + i);
    day.setHours(0,0,0,0);
    const isToday = day.getTime() === today.getTime();
    const isWeekend = (i>=5); // 5=Sáb, 6=Dom (cal-week empieza en Lunes)
    const iso = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
    const dayPieces = data.filter(p=>{
      const pd = parseDia(p);
      if(!pd) return false;
      const c = new Date(pd); c.setHours(0,0,0,0);
      return c.getTime() === day.getTime();
    });
    const addBtn = isWeekend ? '' : `<button class="cal-add-btn" title="Añadir contenido este día" onclick="event.stopPropagation();openAddModal('${iso}')">+</button>`;
    const dropAttrs = isWeekend ? '' : `ondragover="calDragOver(event)" ondragleave="calDragLeave(event)" ondrop="calDrop(event,'${iso}')"`;
    html += `<div class="cal-day${isWeekend?' cal-day-weekend':''}">
      <div class="cal-day-header${isWeekend?' weekend':''}">
        <div class="cal-day-name">${dayNames[i]}</div>
        <div class="cal-day-num${isToday?' today':''}">${day.getDate()}</div>
        ${addBtn}
      </div>
      <div class="cal-day-body${isWeekend?' weekend':''}" ${dropAttrs} data-iso="${iso}">`;
    if(isWeekend){
      html += `<div class="cal-libre">Libre<span>sin publicación</span></div>`;
    } else if(!dayPieces.length){
      html += `<div class="cal-empty">—</div>`;
    } else {
      dayPieces.forEach(p=>{
        const calClass = p.quien==='Jessica' ? 'jessica-cal' : 'junior-cal';
        html += `<div class="cal-card ${calClass}" draggable="true" data-id="${p.id}" ondragstart="calDragStart(event,'${p.id}')" ondragend="calDragEnd(event)" onclick="openDetail('${p.id}')">
          <div class="cal-card-tipo">${p.tipo} · ${p.quien}</div>
          <div class="cal-card-title">${esc(p.idea)}</div>
        </div>`;
      });
    }
    html += `</div></div>`;
  }
  html += `</div></div>`;
  document.getElementById('mainContent').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
// DRAG & DROP (calendario tipo Trello)
// ═══════════════════════════════════════════════════════════
let dragId = null;
function calDragStart(e, id){
  dragId = id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.classList.add('dragging');
}
function calDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.cal-day-body.drop-over').forEach(el=>el.classList.remove('drop-over'));
  dragId = null;
}
function calDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop-over');
}
function calDragLeave(e){
  e.currentTarget.classList.remove('drop-over');
}
function calDrop(e, iso){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-over');
  const id = dragId || e.dataTransfer.getData('text/plain');
  if(id) movePieceToDate(id, iso);
}

// ═══════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════
document.getElementById('navTabs').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-tab');
  if(!btn) return;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  if(activeTab==='cal') renderCalendar(); else renderAll();
});

document.getElementById('filterChips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const {filter, val} = chip.dataset;
  if(activeFilters[filter]===val){
    delete activeFilters[filter];
    chip.classList.remove('active');
  } else {
    // Remove other chips for same filter
    document.querySelectorAll(`.chip[data-filter="${filter}"]`).forEach(c=>c.classList.remove('active'));
    activeFilters[filter]=val;
    chip.classList.add('active');
  }
  renderAll();
});
